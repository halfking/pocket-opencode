# pocket.itestu.cn — 9443 PROXY-protocol vhost.
# Upstream is 252 loopback via SSH reverse tunnel to the Mac pocketd :8090
# (NetBird mesh from this Mac is blocked: SG does not allow :10000/:33080).
# Tunnel: ssh -R 127.0.0.1:18090:127.0.0.1:8090 252
#         ssh -R 127.0.0.1:14175:127.0.0.1:4175 252
upstream pocket_mac_api {
    server 127.0.0.1:18090;
    keepalive 8;
}

upstream pocket_mac_web {
    server 127.0.0.1:14175;
    keepalive 4;
}

server {
    listen 9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name pocket.itestu.cn;

    ssl_certificate /etc/letsencrypt/live/pocket.itestu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocket.itestu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    location = /healthz {
        proxy_pass http://pocket_mac_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /plugin/ws {
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://pocket_mac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
