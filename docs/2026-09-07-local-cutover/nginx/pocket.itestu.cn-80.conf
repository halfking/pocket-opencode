# HTTP-01 ACME + HTTPS redirect for pocket.itestu.cn
server {
    listen 80;
    listen [::]:80;
    server_name pocket.itestu.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
