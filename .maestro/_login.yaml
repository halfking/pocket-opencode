# 登录/解锁子流程（被其它 flow 用 runFlow 引用）
#
# 这个子流程存在的原因，是本项目在真机上**有四种**可能的起始状态，
# 2026-10-01 首次真机 Maestro 三种都撞上了，第四种当天稍后才撞上：
#
#   A. 已登录 + 本地库已解锁  -> 什么都不用做
#   B. 已登录 + 本地库未解锁  -> 只差主密码（页面标题「解锁本地数据」）
#   C. 完全未登录              -> 要账号密码（页面有「输入用户名」）
#   D. 登录成功但**没有主密码** -> 弹「创建主密码」对话框（2026-10-01 12:10 实测撞上）
#
# D 最阴险，它是**登录之后**才弹的，而且会让 A/B/C 三种判据全部失效：
# LoginView.handleLogin / completeAuth 在 `!cryptoConfig.cfg.hasMasterPassword`
# 时 `showMasterPasswordDialog = true; return` —— 直接 return，**不跳 /ai**。
# 于是 App 停在登录页 + 一个模态框上，「打开菜单」「输入用户名」都还在，
# 看起来像 C；但你点登录会重复弹，永远出不去。
# 触发条件：`hasMasterPassword` 只是 localStorage 里的 `pocket_crypto_cfg`
# 标志（stores/crypto-config.ts），后端无记录、Keystore 也不一定有。
# MIUI 清一次站点数据 / 重装 / 存储回收，这个标志就没了，本地加密库却还在。
# ⚠️ 该状态下**必须用与现有本地库相同的主密码**（$POCKET_MASTER），
#    换一个会与已有库密钥不一致（详见 handoff §4.74 BUG-AV）。
#
# B 容易误判：它**长得像**需要登录，但 localStorage 里 token 还在，
# 输账号密码是错的。本地 SQLCipher 的 crypto key 只存在于内存，
# 进程一死就丢，守卫就把用户弹到这个页面（handoff §4.48.1 记过同一现象）。
#
# 「已进入 App」的标志统一用 **打开菜单**：它是已登录 App 外壳 header 上的
# aria-label，登录页与解锁页都没有。**不要用「全部正常」**——那是 TasksView
# 的分诊条的标签，只在没有待处理任务时才出现，且 <380px 窄屏下被 CSS 隐藏
# （TasksView.vue:1443），设备上留一条待处理任务就会假失败。踩过。
#
# 口令全部从环境变量读，本文件里没有任何明文：
#   POCKET_MASTER   —— 本地库主密码（解锁用 / D 态创建用）
#   POCKET_DEV_PASS —— dev 旁路账号口令（登录用）
# 由 scripts/maestro-run.mjs 注入。变量缺失应直接失败，不要退化成硬编码。
appId: com.kaixuan.opencode.pocket
---

# ⚠️ 开头必须用 extendedWaitUntil 而不是裸 assert。
#    Maestro 读的是 **Android 无障碍树**，而 WebView 是**异步发布**这棵树的：
#    DOM 里元素已经在了（启动器用 CDP 确认过），无障碍树还没推过来，
#    裸 assert 会在树就绪前那一瞬间直接判 false。
#    实测踩到过：preflight 刚报「App 外壳已渲染」，flow 第一条 assert 仍失败。
# ⚠️ 2026-10-01 12:10 实测的**第四种失败**：上一轮 run 死在 D 态（主密码弹窗），
#    弹窗留在屏幕上没关。下一轮起手就撞上它，此时「打开菜单」「输入用户名」
#    都不成立（模态框挡着、且 D 态本来就没登录），于是这里**只等三个旧判据会
#    直接超时 60s**，flow 第一条就 FAILED，看起来像 App 坏了。
#    ⇒ 判据集合必须包含「创建主密码」，并且后面的 D 分支要能收拾它。
- extendedWaitUntil:
    visible: "打开菜单|主导航|解锁本地数据|输入用户名|创建主密码"
    timeout: 60000

# ⚠️ 必须**先把锁定守卫逼出来**，否则 B 分支永远轮不到执行。
#
# 踩过的坑（2026-10-01，代价是一整轮假绿）：重建安装后 App 冷启动停在 #/ai，
# 外壳可见、token 还在，但本地加密库其实**是锁着的**。而解锁页
# 「解锁本地数据」只有在**导航到受保护路由**时才会被守卫渲染出来——
# #/ai 不是受保护路由，于是页面上根本没有那句字，下面的 runFlow when
# 条件不成立 ⇒ 整个解锁分支被 SKIPPIPPED ⇒ flow 带着一把没开的锁继续跑，
# 下游每一步都失败，看起来像产品坏了。
#
# 办法：先点一次底部导航的「会议」（受保护路由），把守卫和解锁页逼出来。
# 已解锁时这一步只是普通导航，无副作用；optional 保证点不到时不失败。
- tapOn:
    text: "会议"
    optional: true
# 探完受保护路由后可能落在四种状态之一：已解锁的 App 外壳 / 解锁页 / 登录页 /
# D 态主密码弹窗 / 还在切换中。不能只等外壳 —— 被守卫弹到解锁页时外壳的
# 「打开菜单」本来就不在。
- extendedWaitUntil:
    visible: "打开菜单|主导航|解锁本地数据|输入用户名|创建主密码"
    timeout: 20000

# ---- B. 已登录但本地库锁定：只输主密码 ----
- runFlow:
    when:
      visible: "解锁本地数据"
    commands:
      # ⚠️ 必须按坐标点输入框，不能 tapOn "主密码"。
      #    「主密码」是 label，点它不一定把焦点交给 input；实测点完 input 仍为空，
      #    「解锁」保持 disabled，于是后面的 tapOn 是个空操作，解锁页纹丝不动。
      #    坐标来自 720x1640 实机截屏：input 中心约 (360,967) → 50%,59%。
      - tapOn: { point: "50%,59%" }
      - inputText: ${POCKET_MASTER}
      - hideKeyboard
      # ⚠️ 这条断言是本分支的关键：没有它，「解锁」点不动会被当成
      #    「点了但页面没跳」而去怪 App。实测踩过 —— 合成 inputText 没落进
      #    WebView 输入框，按钮恒 disabled，flow 却一路 COMPLETED。
      #    和闪卡 flow 里「保存按钮必须随输入解禁」是同一条纪律。
      - extendedWaitUntil:
          visible: { text: "解锁", enabled: true }
          timeout: 20000
      - assertVisible: { text: "解锁", enabled: true }
      - tapOn: { text: "解锁", enabled: true }
      - extendedWaitUntil:
          notVisible: "解锁本地数据"
          timeout: 60000
      - assertNotVisible: "解锁本地数据"
      - assertNotVisible: "输入用户名"
      - assertVisible: "打开菜单"

# ---- D-1. 上一轮 run 死在主密码弹窗上，弹窗还留在屏幕上 ----
# 必须排在 C 之前：模态框挡着时「输入用户名」在无障碍树里**仍然可见**
# （实测 step-005 的导出里登录页整棵树都在），所以 C 的条件会误成立，
# 于是又去点一次「登录」，弹窗再弹一次，永远出不去。
- runFlow:
    when:
      visible: "创建主密码"
    commands:
      - runFlow: _set-master-password.yaml

# ---- C. 完全未登录：账号密码登录 ----
# ⚠️ 登录之后不能直接等「打开菜单」：LoginView.handleLogin 在
#    !hasMasterPassword 时弹主密码对话框并 return（不跳 /ai）。
#    所以要么落到外壳、要么落到 D 态弹窗，两个都得算成功。
# ⚠️ 同理不能 assertNotVisible "输入用户名"：D 态下登录页在模态框**背后**，
#    无障碍树里照旧可见，断言必假失败。
- runFlow:
    when:
      visible: "输入用户名"
    commands:
      - tapOn: "输入用户名"
      - eraseText
      - inputText: "admin"
      # ⚠️ 必须断言输入框的**实际值**。2026-10-01 13:00 实测：不加这条时，
      #    用户名框里躺的是 `administrationundefinedy` 这种脏值，登录必然失败，
      #    现场只留下一句「登录失败：用户名或密码错误」——会把人引去查后端鉴权，
      #    而真因是 MIUI 输入法在这台设备上把合成输入搅坏了。
      #    加了断言，失败点就落在「输入没落进去」上，而不是下游的登录失败。
      #    （无障碍树里 input[type=text] 和 input[type=password] 都暴露了值，
      #      所以这条断言成立。若哪天 WebView 不再暴露，改用坐标 + 重试。）
      - assertVisible: { text: "^admin$" }
      - tapOn: "输入密码"
      - inputText: ${POCKET_DEV_PASS}
      # ⚠️ 这里**不能**写 `assertVisible: { text: "^${POCKET_DEV_PASS}$" }`。
      #    实测两次：Maestro 在**选择器**里不展开 ${POCKET_DEV_PASS}，
      #    直接把断言变成 `^undefined$`，于是必然红；而同一变量写在
      #    `inputText:` 里是能正常展开的（登录确实用对了口令）。
      #    启动器已打印「POCKET_DEV_PASS=14 字符」证明变量确实传到了子进程，
      #    所以是 Maestro 选择器侧的展开问题，不是注入问题。
      #    ⇒ 改用等价但不含变量的判据：**「登录」按钮 enabled=true**。
      #    它在两个字段任一为空时是 disabled（LoginView 的 disabled 绑定），
      #    所以它证明了「两个字段都真的填进去了」，覆盖面与值断言相当。
      - assertVisible: { text: "登录", enabled: true }
      - hideKeyboard
      - tapOn: "登录"
      - extendedWaitUntil:
          visible: "打开菜单|创建主密码"
          timeout: 60000
      - assertNotVisible: "解锁本地数据"

# ---- D-2. 上面那次登录触发的「创建主密码」 ----
# 与 D-1 是同一个条件，**必须判两次**：D-1 处理「开场就带着弹窗」，
# D-2 处理「刚登录完才弹」。少任何一个都会停在弹窗上。
- runFlow:
    when:
      visible: "创建主密码"
    commands:
      - runFlow: _set-master-password.yaml

# ---- 兜底：四种都没命中说明没落在 App 里，直接报出来 ----
- assertVisible: "打开菜单"

# ⚠️ 这里等的是 **「主导航」**（底部导航容器的 aria-label），不是「+ 新任务」。
#    「+ 新任务」「运行中 6」这些是**数据依赖**的元素：列表重渲染时抓到的快照里
#    可能正好没有它们（实测过一次，页面数据都到了、按钮却不在快照里），
#    用它们当判据就是拿运行时状态当确定性信号。
#    「主导航」是结构性的，永远在。
- extendedWaitUntil:
    visible: "主导航"
    timeout: 30000
- assertVisible: "主导航"

# ⚠️⚠️ 收尾的**硬判据**：解锁页、登录页、主密码弹窗必须都不在了。
#
# 这是本文件最关键的一行，删掉它整套真机结果都不可信。
# 「打开菜单」是 App 外壳 header 的 aria-label，而**解锁页是渲染在 App 外壳里的**
# —— 外壳的「打开菜单」在解锁页上同样可见。所以只拿它收尾的话，
# 主密码输错、库根本没解开，flow 也会全程 COMPLETED。
# 实测到过多次：解锁断言全绿，几秒后 App 又被守卫弹回
# #/login?returnTo=…&unlock=1，下游 flow 全部跟着假绿。
# （证据：2026-10-01 凌晨 ~4 次尝试，scripts/verify-au-fix2.mjs 的
#   P3 硬前置因此一直不满足 —— 那个判据拒绝出结论是对的，
#   否则就会拿着一份「被抢 0/6」的假读数宣布修好了。）
# 「创建主密码」是 2026-10-01 12:10 补的第**四**条：上轮 run 死在弹窗上、
# 弹窗残留，下游 flow 会在登录页上全部失败，而只判前两条时它不会被发现。
- assertNotVisible: "解锁本地数据"
- assertNotVisible: "输入用户名"
- assertNotVisible: "创建主密码"
