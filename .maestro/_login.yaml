# 登录/解锁子流程（被其它 flow 用 runFlow 引用）
#
# 这个子流程存在的原因，是本项目在真机上**有三种**可能的起始状态，
# 2026-10-01 首次真机 Maestro 三种都撞上了：
#
#   A. 已登录 + 本地库已解锁  -> 什么都不用做
#   B. 已登录 + 本地库未解锁  -> 只差主密码（页面标题「解锁本地数据」）
#   C. 完全未登录              -> 要账号密码（页面有「输入用户名」）
#
# B 最容易误判：它**长得像**需要登录，但 localStorage 里 token 还在，
# 输账号密码是错的。本地 SQLCipher 的 crypto key 只存在于内存，
# 进程一死就丢，守卫就把用户弹到这个页面（handoff §4.48.1 记过同一现象）。
#
# 「已进入 App」的标志统一用 **打开菜单**：它是已登录 App 外壳 header 上的
# aria-label，登录页与解锁页都没有。**不要用「全部正常」**——那是 TasksView
# 的分诊条的标签，只在没有待处理任务时才出现，且 <380px 窄屏下被 CSS 隐藏
# （TasksView.vue:1443），设备上留一条待处理任务就会假失败。踩过。
#
# 口令全部从环境变量读，本文件里没有任何明文：
#   POCKET_MASTER   —— 本地库主密码（解锁用）
#   POCKET_DEV_PASS —— dev 旁路账号口令（登录用）
# 由 scripts/maestro-run.mjs 注入。变量缺失应直接失败，不要退化成硬编码。
appId: com.kaixuan.opencode.pocket
---

# ⚠️ 开头必须用 extendedWaitUntil 而不是裸 assert。
#    Maestro 读的是 **Android 无障碍树**，而 WebView 是**异步发布**这棵树的：
#    DOM 里元素已经在了（启动器用 CDP 确认过），无障碍树还没推过来，
#    裸 assert 会在树就绪前那一瞬间直接判 false。
#    实测踩到过：preflight 刚报「App 外壳已渲染」，flow 第一条 assert 仍失败。
- extendedWaitUntil:
    visible: "打开菜单"
    timeout: 60000

# ⚠️ 必须**先把锁定守卫逼出来**，否则 B 分支永远轮不到执行。
#
# 踩过的坑（2026-10-01，代价是一整轮假绿）：重建安装后 App 冷启动停在 #/ai，
# 外壳可见、token 还在，但本地加密库其实**是锁着的**。而解锁页
# 「解锁本地数据」只有在**导航到受保护路由**时才会被守卫渲染出来——
# #/ai 不是受保护路由，于是页面上根本没有那句字，下面的 runFlow when
# 条件不成立 ⇒ 整个解锁分支被 SKIPPIPPED ⇒ flow 带着一把没开的锁继续跑，
# 下游每一步都失败，看起来像产品坏了。
#
# 办法：先点一次底部导航的「会议」（受保护路由），把守卫和解锁页逼出来。
# 已解锁时这一步只是普通导航，无副作用；optional 保证点不到时不失败。
- tapOn:
    text: "会议"
    optional: true
# 探完受保护路由后可能落在四种状态之一：已解锁的 App 外壳 / 解锁页 / 登录页 /
# 还在切换中。不能只等外壳 —— 被守卫弹到解锁页时外壳的「打开菜单」本来就不在。
- extendedWaitUntil:
    visible: "打开菜单|主导航|解锁本地数据|输入用户名"
    timeout: 20000

# ---- B. 已登录但本地库锁定：只输主密码 ----
- runFlow:
    when:
      visible: "解锁本地数据"
    commands:
      # ⚠️ 必须按坐标点输入框，不能 tapOn "主密码"。
      #    「主密码」是 label，点它不一定把焦点交给 input；实测点完 input 仍为空，
      #    「解锁」保持 disabled，于是后面的 tapOn 是个空操作，解锁页纹丝不动。
      #    坐标来自 720x1640 实机截屏：input 中心约 (360,967) → 50%,59%。
      - tapOn: { point: "50%,59%" }
      - inputText: ${POCKET_MASTER}
      - hideKeyboard
      # ⚠️ 这条断言是本分支的关键：没有它，「解锁」点不动会被当成
      #    「点了但页面没跳」而去怪 App。实测踩过 —— 合成 inputText 没落进
      #    WebView 输入框，按钮恒 disabled，flow 却一路 COMPLETED。
      #    和闪卡 flow 里「保存按钮必须随输入解禁」是同一条纪律。
      - extendedWaitUntil:
          visible: { text: "解锁", enabled: true }
          timeout: 20000
      - assertVisible: { text: "解锁", enabled: true }
      - tapOn: { text: "解锁", enabled: true }
      - extendedWaitUntil:
          notVisible: "解锁本地数据"
          timeout: 60000
      - assertNotVisible: "解锁本地数据"
      - assertNotVisible: "输入用户名"
      - assertVisible: "打开菜单"

# ---- C. 完全未登录：账号密码登录 ----
- runFlow:
    when:
      visible: "输入用户名"
    commands:
      - tapOn: "输入用户名"
      - eraseText
      - inputText: "admin"
      - tapOn: "输入密码"
      - inputText: ${POCKET_DEV_PASS}
      - hideKeyboard
      - tapOn: "登录"
      - extendedWaitUntil:
          visible: "打开菜单"
          timeout: 60000
      - assertNotVisible: "输入用户名"
      - assertVisible: "打开菜单"

# ---- 兜底：三种都没命中说明没落在 App 里，直接报出来 ----
- assertVisible: "打开菜单"

# ⚠️ 这里等的是 **「主导航」**（底部导航容器的 aria-label），不是「+ 新任务」。
#    「+ 新任务」「运行中 6」这些是**数据依赖**的元素：列表重渲染时抓到的快照里
#    可能正好没有它们（实测过一次，页面数据都到了、按钮却不在快照里），
#    用它们当判据就是拿运行时状态当确定性信号。
#    「主导航」是结构性的，永远在。
- extendedWaitUntil:
    visible: "主导航"
    timeout: 30000
- assertVisible: "主导航"

# ⚠️⚠️ 收尾的**硬判据**：解锁页与登录页必须都不在了。
#
# 这是本文件最关键的一行，删掉它整套真机结果都不可信。
# 「打开菜单」是 App 外壳 header 的 aria-label，而**解锁页是渲染在 App 外壳里的**
# —— 外壳的「打开菜单」在解锁页上同样可见。所以只拿它收尾的话，
# 主密码输错、库根本没解开，flow 也会全程 COMPLETED。
# 实测到过多次：解锁断言全绿，几秒后 App 又被守卫弹回
# #/login?returnTo=…&unlock=1，下游 flow 全部跟着假绿。
# （证据：2026-10-01 凌晨 ~4 次尝试，scripts/verify-au-fix2.mjs 的
#   P3 硬前置因此一直不满足 —— 那个判据拒绝出结论是对的，
#   否则就会拿着一份「被抢 0/6」的假读数宣布修好了。）
- assertNotVisible: "解锁本地数据"
- assertNotVisible: "输入用户名"
