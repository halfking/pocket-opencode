# 邮箱验证码密码管理功能测试套件
#
# 这是一个聚合测试套件，按顺序运行所有邮箱相关的测试场景
#
# 前置要求：
#   1. 后端服务已启动并配置 SMTP_DEBUG_ECHO=true
#   2. 已安装最新版本的 APK
#   3. 已设置所需的环境变量
#
# 环境变量：
#   POCKET_MASTER          - 主密码
#   POCKET_DEV_PASS        - dev 旁路账号口令
#   POCKET_TEST_EMAIL      - 测试邮箱
#   POCKET_NEW_PASS        - 新密码（用于密码修改测试）
#   POCKET_OLD_PASS        - 旧密码（用于恢复）
#   POCKET_NO_EMAIL_USER   - 没有邮箱的测试用户
#   POCKET_NO_EMAIL_PASS   - 该用户的密码
#   POCKET_TEST_EMAIL_NEW  - 新邮箱地址
#
# 测试执行顺序：
#   1. 修改密码功能测试（完整流程）
#   2. 错误场景测试
#   3. 登录后邮箱设置测试（需要特殊账号）
#
appId: com.kaixuan.opencode.pocket
---

# 测试准备：清理应用状态
- evalScript: |
    // 清理可能影响测试的状态
    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {
      console.warn('Failed to clear storage:', e);
    }
    return true;

# 测试 1: 核心功能 - 已登录用户修改密码
- runFlow:
    file: email-password-change.yaml
    env:
      POCKET_MASTER: ${POCKET_MASTER}
      POCKET_TEST_EMAIL: ${POCKET_TEST_EMAIL}
      POCKET_OLD_PASS: ${POCKET_OLD_PASS}
      POCKET_NEW_PASS: ${POCKET_NEW_PASS}

# 等待一段时间让系统稳定
- evalScript: |
    return new Promise(resolve => setTimeout(resolve, 3000));

# 测试 2: 错误场景测试
- runFlow:
    file: email-password-errors.yaml
    env:
      POCKET_MASTER: ${POCKET_MASTER}
      POCKET_TEST_EMAIL: ${POCKET_TEST_EMAIL}

# 等待一段时间让系统稳定
- evalScript: |
    return new Promise(resolve => setTimeout(resolve, 3000));

# 测试 3: 登录后邮箱设置流程（需要特殊测试账号）
# 注意：这个测试需要一个没有邮箱的测试账号
# 如果环境中没有这样的账号，可以跳过此测试
- runFlow:
    when:
      true: ${POCKET_NO_EMAIL_USER}  # 只有设置了这个变量才运行
    file: email-setup-on-login.yaml
    env:
      POCKET_MASTER: ${POCKET_MASTER}
      POCKET_NO_EMAIL_USER: ${POCKET_NO_EMAIL_USER}
      POCKET_NO_EMAIL_PASS: ${POCKET_NO_EMAIL_PASS}
      POCKET_TEST_EMAIL_NEW: ${POCKET_TEST_EMAIL_NEW}

# 测试完成标记
- evalScript: |
    console.log('✅ 邮箱验证码密码管理功能测试套件执行完成');
    return true;
