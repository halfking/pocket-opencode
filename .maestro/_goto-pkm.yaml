# 进入 PKM 笔记页（笔记相关 flow 用 runFlow 引用）
#
# 为什么单独抽一个：本项目的本地 SQLCipher 库是**按需解锁**的——
# 守卫只在「导航到依赖本地库的路由」那一刻才判定。所以：
#   启动后停在 #/ai 时看起来一切正常（打开菜单可见、AI 工具页正常），
#   但本地库其实**还锁着**。
# 于是「先检查是否已解锁」这种写法必然漏判：#/ai 不依赖本地库，检查永远通过。
# 唯一可靠的做法就是**先去目标页，让守卫把解锁页弹出来，再解锁**。
# 2026-10-01 真机首次跑 Maestro 就栽在这里：旧 _login.yaml 拿「打开菜单可见」
# 当已解锁标志，结果一进笔记页就被弹回解锁页。
#
# 交互方式的实测结论（真机 720x1640 / CSS 360x820 / dpr=2）：
#   ✅ tapOn: "文本"  可用
#   ❌ tapOn: {point: "88%,95%"}  两次都没命中（Maestro 报 COMPLETED 但页面不动）
#   ❌ evalScript: ${location.hash = '#/more'}
#      → TypeError: Cannot set property 'hash' of undefined
#        说明 evalScript 不在 WebView 的 JS 上下文里跑，不能用来做 hash 导航
# 所以这里一律用文本点击，并用 extendedWaitUntil 兜住状态切换。
appId: com.kaixuan.opencode.pocket
---
# 进「更多」之前先确认 AI 工具页内容与底部导航都渲染完了。
# 底部导航是 position:fixed 一直在屏幕上，但页面还在做数据加载时点它，
# 实测有两种失败形态：① 元素还没进视图树，tapOn 直接 FAILED；
#   ② 元素在、报 COMPLETED，但路由没变。所以这里既等页面内容，也等目标本身。
- extendedWaitUntil:
    visible: "主导航"
    timeout: 30000
- extendedWaitUntil:
    visible: "更多"
    timeout: 20000

- tapOn: "更多"
- waitForAnimationToEnd:
    timeout: 3000

# ⚠️ 重试必须写成「不会失败的命令」：Maestro 遇到失败的断言会**直接中止整条 flow**，
#    所以任何 extendedWaitUntil 一旦超时，后面的补救根本没机会跑（实测踩过）。
#    正确做法是：先用 runFlow when 做条件判断（判断本身不算失败），
#    把可能失败的等待放在最后一条。
- runFlow:
    when:
      notVisible: "PKM笔记"
    commands:
      - tapOn: "更多"
      - waitForAnimationToEnd:
          timeout: 3000

- extendedWaitUntil:
    visible: "PKM笔记"
    timeout: 20000
- assertVisible: "PKM笔记"

- tapOn: "PKM笔记"

# 守卫判定：本地库没解锁会把会话改写成 #/login?returnTo=/pkm/today&unlock=1
#
# ⚠️ 2026-10-02：这里原来是一段 runFlow，用坐标点密码框 + `inputText: ${POCKET_MASTER}`
#    去解锁。**那条路径必然失效** —— Maestro 把 ${...} 展开成字符串，变量不在它
#    变量域里时就是字面量 "undefined"（与 ${POCKET_DEV_PASS} 同一个缺陷）。
#    本文件自己的第 16 行注释其实已经点破了机制：
#      `evalScript: ${location.hash='#/more'}` → Cannot set property 'hash' of undefined
#      「说明 evalScript 不在 WebView 的 JS 上下文里跑」
#    真机复核（2026-10-02）：这个解锁分支**不是死代码**，确实会被触发——
#    导航到 #/pkm/today 会落到 `#/login?...&unlock=1`，localStorage 里有
#    `pocket_crypto_salt`（PBKDF2 盐 ⇒ 主密码设过），解锁屏只有一个
#    placeholder=输入主密码解锁 的密码框。
#
#    解锁已上移到 scripts/maestro-run.mjs 的 ensureLocalDbUnlocked()（用 CDP 按
#    placeholder 定位，不依赖坐标）。本文件改为**硬断言**：解锁屏出现就红。
#    为什么不再写成 runFlow when —— 那种写法在条件不满足时静默跳过，
#    于是「harness 的解锁悄悄回归了」这件事没有任何人会看见。断言要响。
- assertNotVisible: "解锁本地数据"

- extendedWaitUntil:
    visible: "新建笔记"
    timeout: 60000
- assertVisible: "新建笔记"
