# 进入 PKM 笔记页（笔记相关 flow 用 runFlow 引用）
#
# 为什么单独抽一个：本项目的本地 SQLCipher 库是**按需解锁**的——
# 守卫只在「导航到依赖本地库的路由」那一刻才判定。所以：
#   启动后停在 #/ai 时看起来一切正常（打开菜单可见、AI 工具页正常），
#   但本地库其实**还锁着**。
# 于是「先检查是否已解锁」这种写法必然漏判：#/ai 不依赖本地库，检查永远通过。
# 唯一可靠的做法就是**先去目标页，让守卫把解锁页弹出来，再解锁**。
# 2026-10-01 真机首次跑 Maestro 就栽在这里：旧 _login.yaml 拿「打开菜单可见」
# 当已解锁标志，结果一进笔记页就被弹回解锁页。
#
# 交互方式的实测结论（真机 720x1640 / CSS 360x820 / dpr=2）：
#   ✅ tapOn: "文本"  可用
#   ❌ tapOn: {point: "88%,95%"}  两次都没命中（Maestro 报 COMPLETED 但页面不动）
#   ❌ evalScript: ${location.hash = '#/more'}
#      → TypeError: Cannot set property 'hash' of undefined
#        说明 evalScript 不在 WebView 的 JS 上下文里跑，不能用来做 hash 导航
# 所以这里一律用文本点击，并用 extendedWaitUntil 兜住状态切换。
appId: com.kaixuan.opencode.pocket
---
# 进「更多」之前先确认 AI 工具页内容与底部导航都渲染完了。
# 底部导航是 position:fixed 一直在屏幕上，但页面还在做数据加载时点它，
# 实测有两种失败形态：① 元素还没进视图树，tapOn 直接 FAILED；
#   ② 元素在、报 COMPLETED，但路由没变。所以这里既等页面内容，也等目标本身。
- extendedWaitUntil:
    visible: "主导航"
    timeout: 30000
- extendedWaitUntil:
    visible: "更多"
    timeout: 20000

- tapOn: "更多"
- waitForAnimationToEnd:
    timeout: 3000

# ⚠️ 重试必须写成「不会失败的命令」：Maestro 遇到失败的断言会**直接中止整条 flow**，
#    所以任何 extendedWaitUntil 一旦超时，后面的补救根本没机会跑（实测踩过）。
#    正确做法是：先用 runFlow when 做条件判断（判断本身不算失败），
#    把可能失败的等待放在最后一条。
- runFlow:
    when:
      notVisible: "PKM笔记"
    commands:
      - tapOn: "更多"
      - waitForAnimationToEnd:
          timeout: 3000

- extendedWaitUntil:
    visible: "PKM笔记"
    timeout: 20000
- assertVisible: "PKM笔记"

- tapOn: "PKM笔记"

# 守卫判定：本地库没解锁就把会话改写成 #/login?returnTo=/pkm/today&unlock=1
#
# ⚠️ 这里的密码框必须用**坐标**点，不能 tapOn "主密码"：
#    在解锁页上「主密码」是一个 [View] 标签，密码框本身是 [EditText]（text 为空）。
#    点标签不会让输入框获得焦点，接着的 inputText 就打进虚空，
#    而 Maestro 照样把 tapOn 和 inputText 都报成 COMPLETED——
#    结果：解锁按钮被点了、但密码是空的、解锁没发生（实测两次）。
#    EditText 的 Android bounds 是 [82,924][638,1020] → 中心 50%,59%。
- runFlow:
    when:
      visible: "解锁本地数据"
    commands:
      - tapOn:
          point: "50%,59%"
      - inputText: ${POCKET_MASTER}
      - hideKeyboard
      - tapOn: "解锁"

- extendedWaitUntil:
    visible: "新建笔记"
    timeout: 60000
- assertVisible: "新建笔记"
- assertNotVisible: "解锁本地数据"
