# Maestro 真机功能流 · 登录表单的**软键盘手势**路径
#
# 为什么需要这条单独一条（2026-10-02）：
#   §4.82 之后，登录改由 maestro-run.mjs 的 preflight 用 CDP 填表单，
#   「谁来敲键盘」换成了 CDP。这带来一个必须补的覆盖空洞：
#   **Maestro 自己那套手势（tap 输入框 → 软键盘 → inputText → hideKeyboard →
#   tap 提交）从此没有被验证过。**
#
#   ⚠️ 更正一条我此前说错的话：软键盘手势**并非完全无覆盖**。
#      tasks-crud.yaml 的「tapOn point 50%,41% + inputText + hideKeyboard」
#      与 flashcards-write.yaml 的同类步骤都跑过，而且它们各自后续的
#      「按钮由 disabled 变 enabled」断言证明文本**真的落进了输入框**。
#      所以「表单输入的手势链」是被覆盖的。
#      真正没覆盖的是**登录表单上**这条链 —— 因为它必须用口令，
#      而 Maestro 的口令传递是坏的（见下）。
#
#   本条 flow 的解法：**用错误口令**。
#     · 不需要真口令 ⇒ 零泄露面，`--env` 的命令行暴露问题也不存在
#     · 仍然完整走一遍 tap → 键盘 → inputText → hideKeyboard → tap 提交
#     · 判据是「后端回了 401 且错误文案上屏」⇒ 请求真的发出去了、真的回来了
#
# 运行（必须带这两个开关，否则 harness 会先替我们登录，登录屏就不存在了）：
#   $env:POCKET_SKIP_CDP_LOGIN='1'
#   $env:POCKET_ALLOW_UNCERTAIN_START='1'
#   node scripts/maestro-run.mjs .maestro/login-gesture.yaml
#
# 判据设计（每条都要问「它恒真吗」）：
#   · `登录` enabled:true —— LoginView.vue:100 是 `:disabled="!username || !password || loading"`，
#     所以它变绿**同时证明两个输入框都真收到了文本**。这是本 flow 最硬的一条。
#   · 错误文案 `.*用户名或密码错误.*` —— LoginView.vue:536 的固定文案。
#     它只在一次真实的 401 往返之后出现，空态/加载态都不会有。
#   · `assertNotVisible: "AI 工具"` —— 反向确认没有真的登进去。
appId: com.kaixuan.opencode.pocket
---
# ---- 1. 起点必须是登录页 ----
- extendedWaitUntil:
    visible: "用户名"
    timeout: 45000
- assertVisible: "^密码$"
- assertNotVisible: "AI 工具"

# ---- 2. 用户名：tap 起键盘 → inputText ----
- tapOn: "用户名"
- inputText: "admin"

# ⚠️ 这里的中间 hideKeyboard 是**防御性**的，不是被证明必要的。
#   2026-10-02 做过负控：复制本文件、只删掉两次 tap 之间这一次 hideKeyboard，
#   重跑仍然 `2/2 Flows Passed` ⇒ 在这台设备（720x1640）上，键盘并没有遮住
#   密码框，Maestro 的 tapOn 照样移到了焦点。
#   保留它的理由只是「让每一步不依赖上一步的键盘状态」，零成本；
#   **不要**把它的注释写成「不这样做就失败」——那句话没有证据。
#
#   顺带更正一条我此前写错的东西：2026-10-02 那次登录失败，
#   已证实的根因是 **Maestro 把 ${POCKET_DEV_PASS} 展开成字面量 "undefined"**
#   （.maestro/_probe-env.yaml 坐实：密码框内容 adminPWLEN-undefined），
#   与键盘遮挡无关。键盘遮挡是我当时并列的**另一个假设，从未被隔离验证**。
#   负控说它在本设备上不成立。
- hideKeyboard

# ---- 3. 密码：同样 tap → inputText，用**故意错误**的口令 ----
# ⚠️ 2026-10-07 实测：这里**不能**按文本 tap。
#   把失败现场整棵树导出来核对，登录页一共只有两个 EditText：
#     EditText text='admin'  bounds=[105,1218][973,1336]   ← 用户名，有值
#     EditText text=None     bounds=[105,1430][973,1551]   ← 密码，**没有文本**
#   而标签「用户名」「密码」都是 android.view.View、clickable=false —— 不是输入框。
#   （旧写法 `tapOn "输入密码"` 那个 placeholder 同样不在树里，见本文件其它地方的注释。）
#   ⇒ 密码框**没有可按文本选中的节点**，只能按坐标。取它 bounds 的中心：
#       x=(105+973)/2=539 → 50%（屏宽 1080）
#       y=(1430+1551)/2≈1490 → 62%（屏高 2400）
#     百分比写法与分辨率无关，本轮实测屏 1080x2400。
- tapOn:
    point: "50%,62%"
- inputText: "gesture-probe-wrong-pw"
- hideKeyboard

# 两个框都收到文本 ⇒ 提交按钮解禁
- extendedWaitUntil:
    visible: { text: "登录", enabled: true }
    timeout: 20000
- assertVisible: { text: "登录", enabled: true }

# ---- 4. tap 提交 ⇒ 必须真的发出请求并把 401 显示出来 ----
- tapOn: { text: "登录", enabled: true }
- extendedWaitUntil:
    visible: ".*用户名或密码错误.*"
    timeout: 30000
- assertVisible: ".*用户名或密码错误.*"
- assertNotVisible: "AI 工具"

- takeScreenshot: "logs/maestro/login-gesture-rejected"
