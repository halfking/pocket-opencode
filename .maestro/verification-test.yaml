appId: com.kaixuan.opencode.pocket
---
# OpenPocket 功能验证测试套件
# 验证登录后的核心功能

# 确保应用在前台
- launchApp

# 等待主界面加载
- extendedWaitUntil:
    visible: ".*AI.*|.*会话.*|.*任务.*|.*笔记.*|.*更多.*"
    timeout: 10000

# 测试1: 底部导航栏
- assertVisible: "AI"
- assertVisible: "任务"

# 测试2: 点击AI标签
- tapOn: "AI"
- extendedWaitUntil:
    visible: ".*消息.*|.*Message.*|.*对话.*"
    timeout: 5000
- takeScreenshot: "01-ai-chat"

# 测试3: 点击会话标签
- tapOn: "会话"
- extendedWaitUntil:
    visible: ".*会话.*|.*Session.*"
    timeout: 5000
- takeScreenshot: "02-sessions"

# 测试4: 点击任务标签
- tapOn: "任务"
- extendedWaitUntil:
    visible: ".*任务.*|.*Task.*"
    timeout: 5000
- takeScreenshot: "03-tasks"

# 测试5: 点击笔记标签
- tapOn: "笔记|Notes"
- extendedWaitUntil:
    visible: ".*笔记.*|.*Note.*"
    timeout: 5000
- takeScreenshot: "04-notes"

# 测试6: 点击更多菜单
- tapOn: "更多|More"
- extendedWaitUntil:
    visible: ".*设置.*|.*Settings.*"
    timeout: 5000
- takeScreenshot: "05-more"

# 测试7: 打开设置
- tapOn: "设置"
- extendedWaitUntil:
    visible: ".*通用.*|.*General.*|.*账户.*"
    timeout: 5000
- takeScreenshot: "06-settings"

# 返回主界面
- tapOn: "AI"
- takeScreenshot: "07-final"
