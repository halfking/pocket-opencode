# Maestro 真机功能流 · 会议入口与「开始会议录音」跳转
#
# 为什么要这条：会议是产品的核心闭环（录音 → 转写 → 纪要 → 任务），但真机 rig
# 里**从没有一条 flow 走过会议入口**。已有 8 条 flow 覆盖了 首页/笔记/消息/更多
# 四个一级 tab 与闪卡，唯独 /meetings 只被 notes-crud 间接路过。
#
# 值得专门测的原因是这个转场壳（MeetingRecordView.vue）：
#   onMounted 里 createMeeting() → router.replace('/meetings/:id', {record:'1'})，
#   **catch 分支直接 router.replace('/meetings')**。
#   也就是说——建会议失败（本地库没解锁、写入失败、captureDeviceLocation 抛错）
#   时，界面表现是「点开始会议后弹回列表」，**没有任何错误提示**。
#   用户看到的就是「按了没反应 / 什么都不发生」。
#   这类静默失败只有真机能看见：assertVisible 一条都绿，但根本没进详情页。
#
# 因此本 flow 的核心判据是**「确实进了详情页」**，而不是「点了开始会议没报错」。
#
# 副作用声明：本 flow 会在设备本地库**创建一条会议记录**（这是它的目的）。
# 它不录音、不产生音频文件，点完即退。
#
# 运行：
#   node scripts/maestro-run.mjs .maestro/meetings-entry.yaml
appId: com.kaixuan.opencode.pocket
---
# ---------- 0. 先保证站在有底部导航的页面上 ----------
# 2026-10-03 15:33 实测：preflight 自称已复位到 #/ai，但 App 可能停在上一轮
# 遗留的深链页；而 /email/:id 的 meta 是 bottomNav:false，那页的树里没有
# /ai 的 meta.title「AI 工具」⇒ 照惯例先等它会**永远不可能通过**。
# ⚠️ 下面这个 notVisible 此前是**恒真**的：它写的是「首页」，而设备上
#    `首页`/`Home` 根本不存在 ⇒ 条件永远为真 ⇒ 每次都去点「返回」，
#    而 AI 首页上没有返回按钮 ⇒ 这一步反而会把 flow 打断。改成真判据。
- runFlow:
    when:
      notVisible: "AI 工具"
    commands:
      - tapOn: "返回"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "AI 工具"
    timeout: 30000
- assertVisible: "AI 工具"
- assertNotVisible: "密码登录"

# ---------- 1. 进「笔记」（会议的新家） ----------
# ⚠️⚠️ 2026-10-05 实测修正：IA 重组后**「会议」不再是一级 tab**。
#   重组前底部导航是 首页 · 学习 · 会议 · 更多（见本文件历史注释），
#   重组后是 首页 · 笔记 · 消息 · 更多（BottomNav.vue:100-105），
#   而会议作为**笔记的一种来源**下沉进了 NotesHubView
#   （NotesHubView.vue:41-49：顶栏图标按钮，aria-label = t('notesHub.action.startMeeting')，
#     @click="go('/meetings/new')"）。
#
#   本文件原先的 `tapOn: "更多" → tapOn: "会议" → 等「开始会议录音」` 在新 IA 下
#   **没有落点**：`frontend/src/features/more/hubItems.ts` 里 grep 不到任何
#   meetings/会议 —— 「更多」宫格确实没有会议项。
#
#   ⚠️⚠️ 2026-10-05 二次修正——**上一版我改错了，改法本身也有问题**：
#   我当时写成按 `data-testid="notes-hub-start-meeting"` 定位，理由是
#   「文案随 i18n 变，testid 是契约」。**这个理由是错的**：
#   Maestro 走的是 Android **无障碍树**，而 `data-testid` 是 DOM 属性，
#   **不出现在无障碍树里** ⇒ `visible: "notes-hub-start-meeting"` 恒为 false。
#   实测失败点正是这条。
#   正确做法是用**真实可见文案**，实测值来自 `src/locales/zh-CN.json`：
#     notesHub.action.startMeeting = 「开始会议」   ← 不是「开始会议录音」
#   多语言并写（`|Notes`、`开始会议|Start meeting`）以免换语言就红。
#
#   另：这个按钮是**纯图标**（内含 <span class="material-symbols-outlined">mic</span>，
#   aria-hidden），所以可见文本只有 aria-label 这一条路。
- tapOn:
    text: "笔记|Notes"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "开始会议|Start meeting"
    timeout: 40000
# MIUI 会吞掉底部导航 tap（报 COMPLETED 但界面没动）——补点一次。
- runFlow:
    when:
      notVisible: "开始会议|Start meeting"
    commands:
      - tapOn:
          text: "笔记|Notes"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "开始会议|Start meeting"
    timeout: 30000
- tapOn:
    text: "开始会议|Start meeting"
    retryTapIfNoChange: true

# ---------- 2. 会议录音页 ----------
# ⚠️ 这里**不能**用「会议详情」当判据（既有坏断言，本轮实测钉死）：
#   `grep 会议详情` 在 src 下只命中 router-mobile.ts:323 的 `meta.title`
#   与若干注释，**页面模板里根本不渲染这段文字** ⇒
#   `assertVisible: "会议详情"` 是**恒假**的，与设备/产品状态无关。
#   （MeetingRecordView.vue 只是跳转壳：onMounted 里 createMeeting 后
#    router.replace({name:'meeting-detail', query:{record:'1'}})；
#    真正渲染的是 MeetingDetailView。）
#   真正可见的是 dock 的 aria-label 二态（MeetingMicDock.vue:6）：
#     :aria-label="recording ? '停止录音' : '开始录音'"
- extendedWaitUntil:
    visible: "会议详情"
    timeout: 40000

# ---------- 3. 核心：点「开始会议录音」必须真的进详情页 ----------
# 这是本 flow 唯一有判别力的部分。MeetingRecordView 的 catch 分支会把
# 一切失败都吞成「弹回列表」，所以「没报错」不等于「成功」。
#
# ⚠️ 2026-10-05：原先这里有一句 `tapOn: "开始会议录音"`。新 IA 下入口按钮
#   就是它本身（笔记 tab 的 notes-hub-start-meeting），上面已经点过一次了；
#   留着会变成在录音页里再找一个不存在的按钮，必然超时。已删。
#   真正的判据是下面那些「会议详情 / 录音二态 / 即时总结」。

# ---- 麦克风权限弹窗（2026-10-04 02:08 真机实拍）----
# 进详情页时 `?record=1` 会**自动开始录音**，于是系统弹出运行时权限框
# 「是否允许"OpenCode Pocket"使用麦克风进行录音」，三个按钮：
# 拒绝 / 本次使用允许 / 仅在使用中允许。
#
# 它整层盖住页面 ⇒ 下面那条 `visible: "会议详情"` 必然超时，
# 而报错指向「会议详情」—— 跟根因隔了一步（失败截图里「会议详情/录音中/
# 正在聆听」其实全都在，被弹窗盖着而已）。这类误读本文件开头就写过。
#
# 为什么放在这里就地清，而不是交给 _dismiss-system-dialogs：
#   那个子流程在**每轮 run 的开头**跑，而权限框是**进详情页那一刻**才弹的，
#   开头清不到。同样的就地处理 notes-stt-error-visibility.yaml:268 已经在用。
# 优先选「仅在使用中允许」：录音要持续一会儿，「本次使用允许」在某些 ROM 上
# 会在录音中途被撤销。
- tapOn:
    text: "仅在使用中允许"
    optional: true
- tapOn:
    text: ".*允许.*"
    optional: true

# ---- MIUI「温馨提示」（2026-10-04 02:24 真机实拍）----
# 上面那条权限框点掉之后，**本轮中段**又弹了 MIUI 的
# 「即日起本应用将不再支持"语音搜索"功能… / 我知道了」。
# 失败截图里「会议详情 / 录音中 00:11 / 正在聆听…」其实全都在页面上，
# 只是被这个框盖住了下半屏 ⇒ `visible: "会议详情"` 超时，报错指向一个其实没坏的断言。
#
# _dismiss-system-dialogs 只在每轮 run 的**开头**跑一次，而这个框的出现时机不确定
# （该子流程自己的注释第 12-15 行就记着「这次是在 flow 中段」）。
# ⇒ 这里就地再清一次，与上面权限框同一处理。
- tapOn:
    text: "我知道了"
    optional: true

- extendedWaitUntil:
    visible: "会议详情"
    timeout: 40000

# ⚠️ 2026-10-03 15:45 实测修正：等「开始录音」红了 68s。
#   原因是 MeetingRecordView replace 过去时带 `?record=1`，
#   **自动开始录音** ⇒ 录音 dock 的 aria-label 已经是「停止录音」。
#   ⇒ 判据必须是 dock 的**二态之一**，不是某一个具体状态。
#
# ⚠️⚠️ 2026-10-05 实测修正（本条原先等的是「会议详情」，**恒假**）：
#   「会议详情」只出现在 router-mobile.ts:323 的 `meta.title`，
#   页面模板从不渲染它 ⇒ 这条断言与设备/产品状态**完全无关**，只是永远不成立。
#   本轮把它换成 dock 的二态 —— 那是真正能证明「进了详情页并且在录音」的可见元素。
#
# ⚠️ 2026-10-07 再改一次：上面换成的 dock 二态（`recording ? '停止录音' : '开始录音'`，
#   MeetingMicDock.vue:6）**仍然是 aria-label**，而本设备上 aria-label 一律匹配不到 ——
#   Android 无障碍树 75 个节点 content-desc 全空（_goto-pkm.yaml 的「主导航」已踩实）。
#   2026-10-07 实跑卡在这三处，而失败现场的树里**产品其实完全正常**：
#     会议详情 / 录音中 00:41 / 说话人 1、2 / 即时总结 / 停止
#   也就是真在录音、真在转写。判据在看一个 Maestro 看不见的属性。
#
# ⚠️⚠️ 2026-10-07 第三次改，仍踩在 a11y 树上，最后落到**静态标题**：
#   中间试过等「录音中 00:41」（MeetingDetailView.vue:152，确实是渲染成 text 的），
#   实跑仍然判 false —— 而 Maestro **自己抓的失败现场树里就写着「录音中 00:41」**，
#   节点 bounds=[28,238][1050,333] 在屏内、enabled=true。
#   决定性线索：**计时器跨两轮相隔约 2 分钟的跑批都是「00:41」**，活计时器不可能不变
#   ⇒ Android 无障碍树对 WebView 节点做了缓存，Maestro 读到的是**冻结快照**。
#   ⇒ 判据必须挑**不会随时间变化**的文本，否则缓存一来就飘。
#   「会议详情」满足：它是详情页的静态标题（locales/zh-CN.json:94 meetings.meetingDetail），
#   实测是 android.widget.TextView / bounds=[170,112][493,178] / enabled=true，稳定在屏内。
#   ⚠️ 本文件早先的注释说「会议详情 恒假、只在 router-mobile.ts 的 meta.title 里」——
#   **那条结论已被实测推翻**：它是真渲染出来的页面标题。
- assertVisible: "会议详情"

# 录音界面独有的元素：即时总结面板（MeetingInsightPanel.vue:2 的 aria-label）
- assertVisible: "即时总结|会议纪要"

# ---------- 4. 负向锚点 ----------
# 「还没有会议记录」是**列表页**的空态文案。它若出现，说明 createMeeting
# 抛错后我们其实停在列表上——即那条静默失败。
- assertNotVisible: "还没有会议记录"
- assertNotVisible: "密码登录"
- takeScreenshot: "logs/maestro/meetings-record"
