# Maestro 真机功能流 · 会议入口与「开始会议录音」跳转
#
# 为什么要这条：会议是产品的核心闭环（录音 → 转写 → 纪要 → 任务），但真机 rig
# 里**从没有一条 flow 走过会议入口**。已有 8 条 flow 覆盖了 首页/笔记/消息/更多
# 四个一级 tab 与闪卡，唯独 /meetings 只被 notes-crud 间接路过。
#
# 值得专门测的原因是这个转场壳（MeetingRecordView.vue）：
#   onMounted 里 createMeeting() → router.replace('/meetings/:id', {record:'1'})，
#   **catch 分支直接 router.replace('/meetings')**。
#   也就是说——建会议失败（本地库没解锁、写入失败、captureDeviceLocation 抛错）
#   时，界面表现是「点开始会议后弹回列表」，**没有任何错误提示**。
#   用户看到的就是「按了没反应 / 什么都不发生」。
#   这类静默失败只有真机能看见：assertVisible 一条都绿，但根本没进详情页。
#
# 因此本 flow 的核心判据是**「确实进了详情页」**，而不是「点了开始会议没报错」。
#
# 副作用声明：本 flow 会在设备本地库**创建一条会议记录**（这是它的目的）。
# 它不录音、不产生音频文件，点完即退。
#
# 运行：
#   node scripts/maestro-run.mjs .maestro/meetings-entry.yaml
appId: com.kaixuan.opencode.pocket
---
# ---------- 0. 先保证站在有底部导航的页面上 ----------
# 2026-10-03 15:33 实测：preflight 自称已复位到 #/ai，但 App 可能停在上一轮
# 遗留的深链页；而 /email/:id 的 meta 是 bottomNav:false，那页的树里没有
# 首页/笔记/消息 ⇒ 照惯例先 assertVisible 首页 会**永远不可能通过**。
- runFlow:
    when:
      notVisible: "首页"
    commands:
      - tapOn: "返回"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "首页"
    timeout: 30000
- assertVisible: "首页"
- assertNotVisible: "密码登录"

# ---------- 1. 进「笔记」（会议的新家） ----------
# ⚠️⚠️ 2026-10-05 实测修正：IA 重组后**「会议」不再是一级 tab**。
#   重组前底部导航是 首页 · 学习 · 会议 · 更多（见本文件历史注释），
#   重组后是 首页 · 笔记 · 消息 · 更多（BottomNav.vue:100-105），
#   而会议作为**笔记的一种来源**下沉进了 NotesHubView
#   （NotesHubView.vue:44-46：常驻按钮 data-testid="notes-hub-start-meeting"
#     → go('/meetings/new')）。
#
#   本文件原先的 `tapOn: "更多" → tapOn: "会议" → 等「开始会议录音」` 在新 IA 下
#   **没有落点**：`frontend/src/features/more/hubItems.ts` 里 grep 不到任何
#   meetings/会议 —— 「更多」宫格确实没有会议项。
#   实测失败点正是 `Assert that "开始会议录音" is visible`（前面「更多功能」都过了），
#   与这个判断一致。
#
#   ⇒ 改走笔记 tab 的常驻入口。用 data-testid 而不是中文文案：
#   文案随 i18n 变，testid 是契约。
- tapOn:
    text: "笔记|Notes"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "notes-hub-start-meeting"
    timeout: 40000
- runFlow:
    when:
      notVisible: "notes-hub-start-meeting"
    commands:
      - tapOn:
          text: "笔记|Notes"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: "notes-hub-start-meeting"

# ---------- 2. 会议录音页 ----------
- extendedWaitUntil:
    visible: "开始会议录音|会议详情"
    timeout: 40000

# ---------- 3. 核心：点「开始会议录音」必须真的进详情页 ----------
# 这是本 flow 唯一有判别力的部分。MeetingRecordView 的 catch 分支会把
# 一切失败都吞成「弹回列表」，所以「没报错」不等于「成功」。
#
# ⚠️ 2026-10-05：原先这里有一句 `tapOn: "开始会议录音"`。新 IA 下入口按钮
#   就是它本身（笔记 tab 的 notes-hub-start-meeting），上面已经点过一次了；
#   留着会变成在录音页里再找一个不存在的按钮，必然超时。已删。
#   真正的判据是下面那些「会议详情 / 录音二态 / 即时总结」。

# ---- 麦克风权限弹窗（2026-10-04 02:08 真机实拍）----
# 进详情页时 `?record=1` 会**自动开始录音**，于是系统弹出运行时权限框
# 「是否允许"OpenCode Pocket"使用麦克风进行录音」，三个按钮：
# 拒绝 / 本次使用允许 / 仅在使用中允许。
#
# 它整层盖住页面 ⇒ 下面那条 `visible: "会议详情"` 必然超时，
# 而报错指向「会议详情」—— 跟根因隔了一步（失败截图里「会议详情/录音中/
# 正在聆听」其实全都在，被弹窗盖着而已）。这类误读本文件开头就写过。
#
# 为什么放在这里就地清，而不是交给 _dismiss-system-dialogs：
#   那个子流程在**每轮 run 的开头**跑，而权限框是**进详情页那一刻**才弹的，
#   开头清不到。同样的就地处理 notes-stt-error-visibility.yaml:268 已经在用。
# 优先选「仅在使用中允许」：录音要持续一会儿，「本次使用允许」在某些 ROM 上
# 会在录音中途被撤销。
- tapOn:
    text: "仅在使用中允许"
    optional: true
- tapOn:
    text: ".*允许.*"
    optional: true

# ---- MIUI「温馨提示」（2026-10-04 02:24 真机实拍）----
# 上面那条权限框点掉之后，**本轮中段**又弹了 MIUI 的
# 「即日起本应用将不再支持"语音搜索"功能… / 我知道了」。
# 失败截图里「会议详情 / 录音中 00:11 / 正在聆听…」其实全都在页面上，
# 只是被这个框盖住了下半屏 ⇒ `visible: "会议详情"` 超时，报错指向一个其实没坏的断言。
#
# _dismiss-system-dialogs 只在每轮 run 的**开头**跑一次，而这个框的出现时机不确定
# （该子流程自己的注释第 12-15 行就记着「这次是在 flow 中段」）。
# ⇒ 这里就地再清一次，与上面权限框同一处理。
- tapOn:
    text: "我知道了"
    optional: true

- extendedWaitUntil:
    visible: "会议详情"
    timeout: 40000

# ⚠️ 2026-10-03 15:45 实测修正：本条原先等的是「开始录音」，红了 68s。
#   失败现场显示**我们其实已经成功进了详情页**，而且已经在录了：
#   可见「会议详情 / 录音中 00:41 / 正在聆听… / 停止录音」。
#   原因是 MeetingRecordView replace 过去时带 `?record=1`，
#   **自动开始录音** ⇒ 录音 dock 的 aria-label 已经是「停止录音」。
#   ⇒ 等「开始录音」是在等一个已经翻过去的状态。
#   正确判据是「会议详情」这个页本身，加上 dock 二态之一。
- assertVisible: "会议详情"
- assertVisible: "(开始录音|停止录音)"

# 录音界面独有的元素：即时总结面板（右侧滚动更新摘要）
- assertVisible: "即时总结"

# ---------- 4. 负向锚点 ----------
# 「还没有会议记录」是**列表页**的空态文案。它若出现，说明 createMeeting
# 抛错后我们其实停在列表上——即那条静默失败。
- assertNotVisible: "还没有会议记录"
- assertNotVisible: "密码登录"
- takeScreenshot: "logs/maestro/meetings-record"
