# Maestro：闪卡写路径回归（BUG-K / L / O）
#
# 覆盖本轮三个闪卡缺陷的**用户可见闭环**。为什么单独写这个 flow：
# 这三个缺陷有一个共同点 —— 请求都是 2xx、数据也真的落了库，光看状态码或
# 落库结果都会判成"通过"。只有走完"建卡组 -> 建卡片 -> 回到卡组页看到卡片"
# 才能证明真的修好了。
#
#   BUG-K  没有创建卡组的入口 -> decks=0 -> 保存按钮恒 disabled
#   BUG-L  POST /api/flashcards/notes 恒 405 -> 卡片存不进后端
#   BUG-O  卡片存进去了但卡组页永远看不到（服务端生成的 card 拉不回来）
#
# 断言文本注意事项（踩过的坑）：
#   1. **不能放 emoji**。Java 正则遇到某些 emoji 字节会直接抛异常，断言判 false。
#      所以下面用纯中文/ASCII 描述可见文本。
#   2. **要用「中文|English」正则交替**。模拟器上的 App 默认是英文 locale
#      （底部导航是 Home / Study / Meetings / More），真机是中文。第一版全用中文
#      断言，在模拟器上第一条 `assertVisible: "闪卡"` 就 FAILED —— 失败截图里页面
#      明明是好的，是断言语言不匹配。两种 locale 都要能跑，所以统一用交替正则。
#   3. 卡组名与卡片正面都带固定文案，避免多轮跑时撞上已有的数据导致"看起来通过"。
#   4. 断言要能区分"修前/修后"。BUG-O 修前卡组页的「开始复习」恒 disabled、
#      列表卡片数恒 0；这两个就是判据。不要断言"页面能打开"——那恒真。
#
# 运行：
#   模拟器：maestro --device emulator-5554      test .maestro/flashcards-write.yaml
#   真机  ：maestro --device 192.168.31.19:5555 test .maestro/flashcards-write.yaml
#            （真机需先手动授权安装 maestro driver，见 handoff §4.16.3）
#
# 前置：由 _login.yaml 处理登录/解锁（三种起始状态都覆盖）。
#      不要在这里写 launchApp 之后自己判「已登录」——2026-10-01 真机上
#      Maestro 的 launchApp 默认会先重装 driver 再 am force-stop，
#      在 MIUI 上是「卸载成功、安装被拦」的破坏性循环。统一走 scripts/maestro-run.mjs。

appId: com.kaixuan.opencode.pocket
---
- runFlow: _login.yaml

# ---------- 1. 进闪卡 ----------
# 闪卡不在底部主导航里，在「更多」九宫格内。
- extendedWaitUntil:
    visible: "更多|More"
    timeout: 45000
- tapOn: "更多|More"
- extendedWaitUntil:
    visible: "闪卡|Flashcards|Flashcard"
    timeout: 20000
- tapOn: "闪卡|Flashcards|Flashcard"
- extendedWaitUntil:
    visible: "新建卡片|New card"
    timeout: 20000
- tapOn: "新建卡片|New card"
- extendedWaitUntil:
    visible: "卡组名称|Deck name"
    timeout: 20000

# ---------- 2. BUG-K：就地建卡组 ----------
# 修前这个输入框与按钮根本不存在（列表页的「新建卡组」按钮其实跳到本页）。
# 修后按钮初始是 disabled（因为还没填名字），填完才可点。
- assertVisible: "新建卡组|New deck"
- tapOn: "卡组名称|Deck name"
- inputText: "回归卡组"
- extendedWaitUntil:
    notVisible: "新建卡组[disabled]|New deck[disabled]"
    timeout: 10000
- tapOn: "新建卡组|New deck"
- extendedWaitUntil:
    visible: "正面|Front"
    timeout: 20000

# ---------- 3. 填正反面并保存 ----------
- assertVisible: "背面|Back"
- tapOn: "正面|Front"
- inputText: "回归正面"
- tapOn: "背面|Back"
- inputText: "回归背面"
- extendedWaitUntil:
    notVisible: "保存[disabled]|Save[disabled]"
    timeout: 10000
- tapOn: "保存|Save"

# ---------- 4. BUG-O：卡组页必须看得到刚建的卡片 ----------
# 这是整个 flow 的核心断言。修前：卡组页「开始复习」恒 disabled、正文不出现，
# 而 POST 请求是 201、PG 里数据也在 —— 只看状态码会误判成通过。
- extendedWaitUntil:
    visible: "回归卡组"
    timeout: 25000
- assertVisible: "开始复习|Start review|Review"
- assertVisible: "回归正面"
