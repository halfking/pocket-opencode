# 测试场景：错误场景完整测试
#
# 测试覆盖：
#   - 验证码错误
#   - 验证码过期
#   - 邮箱格式错误
#   - 网络错误
#   - 邮箱冲突
#
# 环境变量：
#   POCKET_TEST_EMAIL     - 测试邮箱
#   POCKET_EXISTING_EMAIL - 已被占用的邮箱
#   POCKET_MASTER         - 主密码
#
appId: com.kaixuan.opencode.pocket
---

# 前置：登录系统
- runFlow: _login.yaml

# 测试场景 1: 验证码错误
- evalScript: |
    window.location.hash = '#/change-password';
    return true;

- extendedWaitUntil:
    visible: ".*修改密码.*"
    timeout: 10000

- tapOn:
    text: "邮箱"
- inputText: ${POCKET_TEST_EMAIL}
- tapOn: "发送验证码"

- extendedWaitUntil:
    visible: ".*验证码.*"
    timeout: 10000

- tapOn:
    text: ".*验证码.*"
- inputText: "000000"  # 错误的验证码

- tapOn:
    text: ".*新密码.*"
- inputText: "NewPass123"
- tapOn:
    text: ".*确认密码.*"
- inputText: "NewPass123"
- hideKeyboard

- tapOn: "修改密码"

# 验证错误提示
- extendedWaitUntil:
    visible: ".*验证码错误.*|.*验证码已过期.*|.*Code.*invalid.*"
    timeout: 10000

# 测试场景 2: 密码不一致
- evalScript: |
    window.location.reload();
    return true;

- extendedWaitUntil:
    visible: ".*修改密码.*"
    timeout: 10000

- tapOn:
    text: "邮箱"
- inputText: ${POCKET_TEST_EMAIL}
- tapOn: "发送验证码"

- extendedWaitUntil:
    visible: ".*验证码.*"
    timeout: 10000

- tapOn:
    text: ".*验证码.*"
- inputText: "123456"

- tapOn:
    text: ".*新密码.*"
- inputText: "NewPass123"
- tapOn:
    text: ".*确认密码.*"
- inputText: "DifferentPass456"  # 不一致的密码
- hideKeyboard

- tapOn: "修改密码"

# 验证错误提示
- extendedWaitUntil:
    visible: ".*两次输入的密码不一致.*|.*Passwords.*not match.*"
    timeout: 5000

# 测试场景 3: 密码强度不足
- evalScript: |
    window.location.reload();
    return true;

- extendedWaitUntil:
    visible: ".*修改密码.*"
    timeout: 10000

- tapOn:
    text: "邮箱"
- inputText: ${POCKET_TEST_EMAIL}
- tapOn: "发送验证码"

- extendedWaitUntil:
    visible: ".*验证码.*"
    timeout: 10000

- tapOn:
    text: ".*验证码.*"
- inputText: "123456"

- tapOn:
    text: ".*新密码.*"
- inputText: "123"  # 太短的密码
- tapOn:
    text: ".*确认密码.*"
- inputText: "123"
- hideKeyboard

- tapOn: "修改密码"

# 验证错误提示
- extendedWaitUntil:
    visible: ".*密码至少.*8.*|.*at least 8.*"
    timeout: 5000

# 测试场景 4: 邮箱格式错误
- evalScript: |
    window.location.reload();
    return true;

- extendedWaitUntil:
    visible: ".*修改密码.*"
    timeout: 10000

- tapOn:
    text: "邮箱"
- inputText: "invalid-email"  # 无效的邮箱格式

- tapOn: "发送验证码"

# 验证错误提示（可能在发送验证码时就被拦截）
- extendedWaitUntil:
    visible: ".*邮箱格式.*|.*invalid.*email.*|.*请输入.*"
    timeout: 5000

# 返回主页
- evalScript: |
    window.location.hash = '#/ai';
    return true;

- extendedWaitUntil:
    visible: ".*打开菜单.*|.*Open menu.*"
    timeout: 10000
