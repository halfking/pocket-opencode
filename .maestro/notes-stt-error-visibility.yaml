# Maestro 真机功能流 · 笔记录音转写失败原因可见性
#
# 这条流守的是 2026-10-01 真机复现并修复的缺陷（见
# docs/handoff/2026-10-01-stt-gateway-discovery.md §11）：
#   录音中显示完整失败原因，点停止后横幅却变成「该功能尚未完成配置」。
#
# 为什么必须用 Maestro 而不是只看 CDP 读数：
#   缺陷的整条链路是「后端 stt_unavailable 文案 → sttFailureText 归一 →
#   rt.error → 渲染层」。前面每一段都有单测，缺的正是**最后一段在真机上
#   到底显示什么**。这条流把「停止后仍能看到可行动原因」变成可重复执行的
#   断言，而不是一次性的截图。
#
# 断言只认三样东西：
#   1. 行动指引「语音转写」—— 说明是 sttFailureText 的成品文案，不是通用兜底
#   2. 通用兜底的两个 i18n 文案**都不在**（errors.notConfigured / sttNotConfigured）
#   3. 界面里不残留裸错误码与技术串
# 兜底文案随 locale 变，断言它们不存在比断言新文案更抗改。
#
# 选择器为什么用 aria-label 而不是 class（2026-10-01 源码核验）：
#   录音 FAB 是 frontend/src/features/notes/VoiceRecorderWidget.vue 的
#     <button class="fab" :aria-label="recording ? '停止录音' : '开始录音'">
#   它**没有 id 属性**，class 在 WebView a11y 树里也不保证暴露。
#   aria-label 会进 content-desc，是 Maestro 唯一稳定的锚点。
#   （本文件初版写的是 `tapOn: id: "fab"` —— 那是把 class 当 id 用，
#     源码核验时就已判定不可靠，改掉了。）
#
# 前置（2026-10-01 实测，缺一即「连不上」）：
#   1. adb reverse tcp:18099 tcp:18111
#   2. pocketd 带 POCKET_DEV_AUTH=true（否则 corsMiddleware 不发 ACAO）
#   3. 明文后端：APK 须以 CAP_ANDROID_SCHEME=http 构建，否则 fetch 一直 pending
#   4. 设备麦克风权限已授予
#   5. **设备语言必须是 zh-CN**（2026-10-02 首次实跑补上的一条，见下）
#
# ---------- ⚠️ 第 6 条：必须先跑夹具，否则本流恒红（2026-10-04 补）----------
#   node scripts/stt-error-fixture.mjs --induce
#   node scripts/maestro-run.mjs .maestro/notes-stt-error-visibility.yaml
#   node scripts/stt-error-fixture.mjs --restore     <-- 跑完必须还原
#
# 为什么：ASR 开通后（mimo-v2.5-asr 有了上游 provider），后端**再也不会**返回
# `stt_unavailable:`。而本流的断言正是围绕这条带错误码的可行动原因 ——
# 前提消失，flow 恒红，于是它**等于没有护栏**（不是回归，见下）。
#
# 夹具怎么造这个前提：把 STT 的 gatewayModel 指向一个不存在的模型。
# server_stt_settings.go 的 gatewayTarget() 里有
#   `stt_unavailable: 网关模型 %q 当前不可用（…）` 这条分支，
# 于是后端确定性地给出带错误码的原因。实测返回里含「外部语音转写服务未配置」，
# **正好命中本流现有的断言正则**，所以 flow 一行都不用改。
#
# ⚠️ 别把「本流红了」读成「产品坏了」。判别式：
#   后端有没有吐 `stt_unavailable:` —— 有则是产品问题，没有则是前提没造出来。
#   2026-10-04 实测：注入前红（页面只有泛化的「转写失败，将在下一段重试」），
#   注入后 2/2 绿。
#
# 另注：429 限流**本来就该**显示泛化提示。frontend/src/api/stt-error.ts 只放行
# `SHOWABLE_STT_CODES`（目前仅 stt_unavailable），注释写明「没有稳定错误码 =
# 可能是技术串（超时/DNS/panic），不展示」。所以限流场景下看不到可行动原因
# 是**符合当前契约**的，别当缺陷报。
#
# ⚠️ 第 5 条是这条流第一次真正跑起来才发现的（2026-10-02，模拟器 emulator-5556）：
#   模拟器默认 `en-US`，App 随之渲染**英文**底部导航（`en-US.json` 里就是
#   `"study": "Study"`），于是 `tapOn: "学习"` 直接 FAILED。
#   ⇒ 这不是产品缺陷，是**流把设备语言当成了隐含前提**：任何英文语言的设备
#     跑这条流都会在同一处挂掉，而且挂得毫无信息量。
#   本流下面的断言文案全是中文，所以正解是**把设备语言钉死**而不是把选择器改成双语：
#     adb -s <serial> root
#     adb -s <serial> shell setprop persist.sys.locale zh-CN
#     adb -s <serial> shell setprop ctl.restart zygote   # 重启后等 boot_completed=1
#     adb -s <serial> reverse tcp:18099 tcp:18099        # reverse 会在重启后丢，要重设
#   （setprop persist.sys.locale 需要 root，否则报 "Failed to set property"。）
#   底部导航的选择器仍写成双语，纯属兜底：万一又有人在英文设备上跑，它至少能
#   走到下一个断言、而不是死在入口。
#
# 运行：
#   $env:JAVA_HOME = 'C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot'
#   $env:PATH     = "$env:JAVA_HOME\bin;$env:PATH"
#   & C:\workspace\openpocket\logs\maestro\dist\maestro\bin\maestro.bat `
#       --device 192.168.31.19:5555 test .maestro\notes-stt-error-visibility.yaml
#
# appId 用 sttdev 并存包：调试包带独立 applicationIdSuffix，与正式包数据隔离，
# 不动用户正式 App 的后端设置（那会清掉登录态）。
#
# ⚠️ 这条流在 MIUI/HyperOS 真机上**需要驱动能装上才能跑**（2026-10-02 实测）：
#   Maestro 每次开会话都会先 uninstall 再 install 驱动（调用链：
#   AndroidDriver.open -> installMaestroApks -> installMaestroDriverApp -> install），
#   而 MIUI 把 ADB 安装劫持到 com.miui.securitycenter 的确认页，
#   对应开发者选项里的「USB 安装」开关。
#   实测：adb install 与 pm install 均报 INSTALL_FAILED_USER_RESTRICTED；
#   系统层 user_restriction 是 none（所以改 settings 的一系列开关都无效）；
#   弹窗自动点「继续安装」连点 2 次被系统撤销；无 root。
#   => 要跑这条流，先在手机「开发者选项 -> USB 安装」打开开关，
#      并保持它为开的。一次成功安装 **不等于之后每次都能跑**。
#
#   另：驱动装上后可能失败在后续步骤。已实测的时序问题（已在本流下方补了等待）：
#     11:38:42.123 Launching app / Stopping app during launch
#     11:38:42.614 Launch app COMPLETED     <- 只用 0.5s，而 App 实测需 1.6s 才 Displayed
#   它抢跑后去抓 hierarchy，抓到的是还没切完的桌面 -> `tapOn "学习|Study"` 报 Element not found。
#   这很容易被误读成「选择器写错」或「设备语言不对」。
#
#   详见 docs/handoff/2026-10-02-stt-maestro-flow-not-closed-on-device.md。
#
#   本次真机验收走的是**不依赖 Maestro 驱动**的等价路径，结论同样有效：
#     adb forward tcp:9333 localabstract:webview_devtools_remote_<pid>
#     + CDP Runtime.evaluate 读 DOM 文本、element.click() 触发交互。
#   为什么等价：这条流的断言**全部是文本断言**（assertVisible/NotVisible），
#   而 uiautomator dump 在这个 WebView 上只吐出 8 个空节点
#   （a11y 树未暴露），本来也读不到任何文案 —— CDP 是当前唯一能读到
#   真实渲染文本的通道，反而比 uiautomator 更贴近「用户看到什么」。
#   实测结论：7/7 断言通过（停止录音后仍显示可行动原因
#   「外部语音转写服务未配置 API Key（设置 → 语音转写）」，
#   两个通用兜底文案与裸错误码/技术串均未出现）。
appId: com.kaixuan.opencode.pocket.sttdev
---
# ---- 本 flow 不写 launchApp，这是 2026-10-03 17:04 用 logcat 定位出来的硬约束 ----
# 现象：flow 一开头 `launchApp`，App 反而**起不来**，第一条断言等满 30s 落空
#   （实测 1m57s = 3×(6s 等提示 + 15s 等动画) + 30s 断言，轮次对得上）。
# logcat 实证（不是猜的）：
#   ActivityTaskManager: START u0 {act=android.app.action.CHECK_ALLOW_START_ACTIVITY
#     ... cmp=com.miui.securitycenter/com.miui.wakepath.ui.ConfirmStartActivity}
#     from uid 10294 from pid ... callingPackage dev.mobile.maestro ... result code=102
# ⇒ MIUI 安全中心把 Maestro「从非 Activity 上下文启动 App」这件事拦下来弹确认框，
#   而这个确认框在自动化里没人点，App 永远回不到前台。
#
# 为什么 harness 的启动不受影响：preflight 用的是 `am start` / `monkey` 走 shell，
#   不是 Maestro 的启动接口，不触发 CHECK_ALLOW_START_ACTIVITY。
#   它已经完成：强停→启动→CDP 登录→主密码解锁→「自证通过：再次进入 #/pkm/today
#   不再弹解锁屏」→复位到 #/ai。App 此刻就在前台且状态确定。
# ⇒ flow 再 launchApp 纯属重复，而且重复的恰好是被拦的那一下。
#
# 保留的只有「清系统提示」：MIUI 的语音引擎下线提示页
#   （com.xiaomi.mibrain.speech/.asr.AsrRemovalNotice，logcat 实证）
#   会在 App 起来后盖到前台。点掉它用 optional，点不到就跳过，不给别的 flow 添乱。
- extendedWaitUntil:
    visible: "我知道了"
    timeout: 6000
    optional: true
- tapOn:
    text: "我知道了"
    optional: true
- extendedWaitUntil:
    visible: "还没有笔记|AI 工具|解锁本地数据|创建主密码"
    timeout: 40000

# ---- 全新并存包首启会停在「创建主密码」，先把本地库建起来 ----
# ⚠️ 2026-10-03 16:28 真机首次装上 sttdev 时踩到：并存包是**全新安装**，
#   本地库里没有 pocket_crypto_salt，于是首启弹的是**「创建主密码」设置向导**，
#   而**不是**下面那个「解锁本地数据」分支。
#   症状极具误导性：harness 的 CDP 登录把表单填了、点提交，30s 后报
#   「登录后仍停在登录页（last hash 超时）」—— 看起来像口令错或后端 401，
#   实际是被向导整层挡在前面，根本没走到登录。
#
#   两个输入框的 placeholder 分别是「主密码（至少 8 位）」与「再次输入主密码」，
#   按钮是「确认」。口令与下面的解锁分支用同一个值，库建好之后那边才命中。
- runFlow:
    when:
      visible: "创建主密码"
    commands:
      - tapOn: "主密码（至少 8 位）"
      - inputText: "PocketStt9527"
      - tapOn: "再次输入主密码"
      - inputText: "PocketStt9527"
      - hideKeyboard
      - tapOn: "确认"
      - extendedWaitUntil:
          notVisible: "创建主密码"
          timeout: 40000

# ---- 冷启动可能停在主密码解锁页，先处理掉 ----
# 2026-10-02 真机（Redmi / Android 14 / WebView 126）实测补充：
#   `inputText` 走软键盘路径会吞字符 —— 实测输入 13 位主密码后
#   input.value.length 时而是 13 时而是 14（多余的位来自后续那次 tap
#   落在输入框上、把键盘重新唤起）。口令错时页面**不报错**：
#   LoginView.unlock() 的 catch 分支只在 initLobster 抛错时才写 error.value，
#   而 AES-GCM 解密失败发生在更下游，于是界面表现为「点了没反应」。
#   ⇒ 这条流在这里必须留够 extendedWaitUntil 超时，别把口令问题
#     误读成路由没跳转。
- runFlow:
    when:
      visible: "解锁本地数据"
    commands:
      - tapOn: "主密码"
      - inputText: "PocketStt9527"
      - hideKeyboard
      - tapOn: "解锁"
      - extendedWaitUntil:
          visible: "AI 工具|首页"
          timeout: 30000

# ---- 进笔记页 → 进语音笔记列表页 ----
# ⚠️ 2026-10-03 17:12 整段重写：IA 又动了一次，本段三级跳转已经**整条作废**。
# 用 CDP 逐级点过去、把每一页的真实文本抓出来对照（不是靠猜）：
#   首页 #/ai        → 任务/会话面板 + 筛选 chip（全部/工作/生活/学习/未分类）
#   更多 #/more      → 「更多功能」宫格：学习 对话 会议 邮箱 定时自动化 技能市场
#                      智能体市场 本地智能体 工作搭子 闪卡 +「运维与高级」
#   学习 #/study     → **仪表盘**：今日待复习 / 今日已完成 / 天连续 / 今日待办 /
#                      待复习卡片 / 收件箱待处理 / 待回顾 / 待办任务 / 每日回顾提醒
#                      —— 这里**已经没有「语音笔记」这一项**了
#   笔记 #/notes     → NotesHubView（hub）：全部/手记/会议纪要/PKM 笔记 四个 chip
#                      +「打开 PKM」「全部笔记」两个常驻入口 + 空态
#   笔记/voice       → NoteListView（列表）：**录音 FAB 只在这里**
#
# 结论一：原路径「更多 → 学习 → 语音笔记」是重组**前**的形状。`/study` 从
#   「来源列表」变成了学习仪表盘，原 flow 必然卡在 `visible: "语音笔记"`
#   （实测 20s 超时报红）。注意报错指向一个**已不存在**的文案，跟「选择器写错」
#   「设备语言不对」长得一模一样，这正是本文件开头警告过的那类误读。
#
# 结论二（真缺陷，本 flow 是它的发现现场）：`/notes` 是 hub，**不渲染录音 FAB**；
#   FAB 的唯一挂载点是 NoteListView.vue:113 的 <VoiceRecorderWidget>，
#   也就是 `/notes/voice`。而「全部笔记」这个入口当时挂在
#   `v-if="counts.total"` 上 ⇒ 空库用户（counts.total === 0）在界面上
#   **找不到任何录音入口**，语音转写整条功能不可达。
#   已修：把「全部笔记」提到常驻条（NotesHubView.vue:85 那个 nav）。
#   本 flow 现在顺带就是这条修复的**真机回归**——进不去就会在这里报红。
#
# 到达判据为什么用「会议纪要」而不是「笔记」：
#   笔记 hub 的页头标题与底部 tab 文案**都是「笔记」**（zh-CN.json
#   `notesHub.title` = 笔记、`nav.notes` = 笔记），拿它当到达判据等于没判。
#   「会议纪要」是 hub 独有的 chip，首页与 /study 都没有（已按上面抓到的
#   两页文本逐字核对），且不随有没有笔记而变化。
#   原 flow 用的「还没有笔记」是**空态文案**——一旦用户建了第一条笔记它就消失，
#   属于把判据绑死在数据状态上，这里一并去掉。
# ⚠️ 2026-10-03 17:46 底部导航必须带 `retryTapIfNoChange: true`：
#   单次 `tapOn: "笔记"`（无论带不带 index、无论用 point 打坐标）在
#   这台 MIUI 上**状态是 COMPLETED 但页面根本没动** —— COMPLETED 只说明
#   「点下去了」，不代表「路由跳了」，这是 Maestro 命令状态最容易骗人的地方。
#   证据链（三条互相独立）：
#     ① `tapOn {text:"笔记", index:0}` 报 COMPLETED(duration 2403ms)，
#        而它紧接着的失败断言所抓的 screen-hierarchy 明确还是首页
#        （AI 工具 / 需要你介入 / 主导航 首页笔记消息更多）；
#     ② 失败瞬间的截图同样是首页，通知栏没被拉开、没有系统弹窗遮挡；
#     ③ **不是产品缺陷**：绕过 Maestro 直接 `adb shell input tap 270 1535`，
#        四个 tab 全部正常跳转（#/notes / #/messages / #/more）。
#   用探针把五种点法排着试了一遍，只有带 retryTapIfNoChange 的那次真正切走：
#   runFlow#1（单次 tap）跑完 when 仍为真 → runFlow#2（retry 版）才切走 →
#   #3~#5 全 SKIPPED。⇒ 结论写死在这里，不要再退回单次点击。
#   层级原因（screen-hierarchy 实测）：可点的是父节点
#   accessibilityText="笔记" clickable=true bounds=[180,1498][360,1608]，
#   而 text="笔记" 的是它内部 clickable=false 的 TextView
#   [246,1570][294,1600] —— WebView 桥接把可点性挂在了父节点上，
#   单次合成 tap 有时打不进去，retry 才补上。
- tapOn:
    text: "笔记|Notes"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "会议纪要"
    timeout: 25000
# 「全部笔记」是常驻入口（不在 v-if 里），空库也点得到 —— 这正是被修的那条。
# 点它之前先断言它在：这一条断言就是「录音入口可达」的判据本体，
# 缺了它的话，后面 tapOn 失败会指向「元素不存在」，看不出是可达性回归。
#
# ⚠️ 2026-10-03 17:30 为什么这两条要用 `.*….*` 包起来（一次真实的假红）：
#   写成 `assertVisible: "全部笔记"` 时**判据为假**，而按钮明明在视口里
#   （CDP 实测：see-all-btn 的 boundingClientRect y=187 h=46 inView=true，
#     body.innerText 也确实含「全部笔记」）。真因是 **Maestro 的文本选择器是
#     整串正则匹配**，而这个按钮的文本节点不是「全部笔记」，是
#     `mic 全部笔记 chevron_right` —— 首尾各夹着一个 Material Symbols
#     的 ligature 名（见本文件下面 NotesHubView 的按钮结构：
#     `<span class="material-symbols-outlined">mic</span>` + label + chevron）。
#     整串匹配下 `全部笔记` 匹配不上，于是报「不可见」。
#   ⇒ 凡是文案旁边带图标 ligature 的按钮，正向断言一律写成 `.*文案.*`。
#     同一份真机 DOM 上「会议纪要」能过，是因为那个 chip 没有图标，文本恰好是纯文案。
# 反向断言（assertNotVisible）**故意保持整串精确匹配**：放宽成 `.*X.*` 后，
#   任何祖先容器（其 innerText 天然包含整页文字）都会命中，判据会从「没有兜底文案」
#   悄悄退化成「整页都不含这几个字」，那是另一种失明。
- assertVisible: ".*全部笔记.*"
- tapOn:
    text: ".*全部笔记.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ".*新建笔记.*"
    timeout: 25000

# ---- 开始录音（aria-label 随状态切换）----
# 同理包 `.*….*`：FAB 的可见文本是 emoji 图标 + aria-label/sr-only 文案
# （VoiceRecorderWidget.vue:20-29），不是纯「开始录音」。
# 也带 retryTapIfNoChange：理由同上，WebView 里的合成 tap 单次可能不生效，
# 而这里点空了会一路静默走到「等即时转写」再超时，失败点离根因很远。
- tapOn:
    text: ".*开始录音.*"
    retryTapIfNoChange: true

# ---- 麦克风权限弹窗（2026-10-03 17:49 真机实拍）----
# 全新安装的并存包第一次点录音，系统会弹
#   「是否允许"OpenCode Pocket"使用麦克风进行录音」
#   三个按钮：拒绝 / 本次使用允许 / 仅在使用中允许
# 它会整层盖住录音面板，于是下一步 `visible: "即时转写"` 必然超时，
# 而报错指向「即时转写」，跟根因隔了两步 —— 与本文件开头记的那类误读同形。
#
# 为什么这里点得动：Maestro 的 tapOn 走整屏 uiautomator 树、不限被测包
# （同 `_dismiss-system-dialogs` 处理 MIUI「我知道了」的依据）。
# 三个按钮按文字取，只有系统弹窗才会出现，不与页面文案冲突。
# 优先选「仅在使用中允许」：录音要持续一会儿，「本次使用允许」在某些
# ROM 上会在录音中途被撤销，导致转写刚起来就断。
- tapOn:
    text: "仅在使用中允许"
    optional: true
- tapOn:
    text: ".*允许.*"
    optional: true
- extendedWaitUntil:
    visible: "即时转写"
    timeout: 25000

# 等一轮增量转写返回。STT 未配置时后端 1 秒内就回 503，
# 不需要真的录满一个分片周期，也不需要说话。
- extendedWaitUntil:
    visible: ".*外部语音转写服务未配置.*|.*网关暂无可用的语音转写模型.*|.*Failed to fetch.*"
    timeout: 40000

# ---- 停止录音，回到列表页 ----
# 同样包 `.*….*` + retry：停止态的 aria-label 是「停止录音」，可见文本是 ⏹ + 该文案。
- tapOn:
    text: ".*停止录音.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "即时转写"
    timeout: 30000

# ---- 核心断言：停止后仍显示**可行动原因**，而不是通用兜底 ----
# 判别力说明（2026-10-02 复核）：单看 `assertVisible: ".*语音转写.*"` 会以为它
# 太宽 —— 通用兜底「语音转写服务尚未配置」同样含"语音转写"四字。但实测判别表：
#   修复态（可行动原因）  A1=true  A2=true  A3=true  => PASS
#   缺陷态（只剩兜底）    A1=true  A2=false A3=false => FAIL
# 即 A1 单独没有判别力，**真正的判别力来自它与下面两条 assertNotVisible 串联**。
# 三条是一条都不能删的整体，拆开单跑任一条都会得到错误的绿灯。
# （顺带：想用「文本里含 设置/API Key/配置」当可行动判据是**不行**的 ——
#   兜底文案本身就含"配置"二字，该判据在缺陷态同样为真。）
- assertVisible: ".*语音转写.*"
- assertNotVisible: "该功能尚未完成配置"
- assertNotVisible: "语音转写服务尚未配置"

# ---- 负向锚点：界面里不该出现任何裸错误码或技术串 ----
- assertNotVisible: "stt_unavailable"
- assertNotVisible: ".*i/o timeout.*"
- assertNotVisible: ".*ERR_CONNECTION.*"
- takeScreenshot: "logs/maestro/notes-stt-error-after-stop"
