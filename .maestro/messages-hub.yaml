# Maestro 真机功能流 · 「消息」tab（新版 IA 的四个一级 tab 之一）
#
# 为什么要这条：「消息」是 2026-10-03 IA 重组后的一级 tab，语义是
# 「邮件 + 订阅 + 任务」三类消息按时间倒序汇成一条统一时间线，顶部 chips 切来源
# （MessagesHubView.vue:13）。它**从来没在真机上跑过**——此前 7 条 flow 里没有一条
# 碰过它。四个一级 tab 只测了 首页/笔记，更没测过 消息。
#
# 风险点也在这：MessagesHubView 的注释里明确记过一个白屏形态
# （"整个「消息」tab 白屏——而且只在「首次进入、收件箱还是空的」这一种"），
# 那是按数据状态才触发的分支，静态读代码看不出来。
#
# 覆盖的结构：
#   chips: 全部 / 邮件 / 订阅 / 任务
#   行列表 data-testid=messages-hub-list
#   空态  「没有新消息」+ 提示「重要邮件、订阅新闻和任务消息会汇总到这里」
#   顶栏  aria-label=全部已读 / 管理订阅
#
# 断言的判别力：
#   · 「消息」二字在**每个页面**的页头都有 ⇒ 单独 assertVisible「消息」几乎恒真，
#     所以真正的判据是 **chips 那一组**（全部/邮件/订阅/任务），
#     只有 MessagesHubView 会同时渲染这四个。
#   · 不硬绑「有消息」或「没消息」：收件箱有没有内容取决于后端同步到哪一步，
#     两种状态都是合法的。判据是「页面**渲染完整**」——chips 齐全，
#     且列表与空态**二选一**（两者都没有才是白屏）。
#
# 运行：
#   node scripts/maestro-run.mjs .maestro/messages-hub.yaml
appId: com.kaixuan.opencode.pocket
---
# ---------- 0. 先保证自己站在一个**有底部导航**的页面上 ----------
# ⚠️ 2026-10-03 15:33 实测踩到：首跑直接红在 `assertVisible: 首页`，
#   失败现场是**邮件详情页**（可见「返回 / 邮件详情 / 回复 / 更多操作」）。
#   原因是 harness preflight 说它已「复位到 #/ai」，但 App 实际停在上一轮
#   遗留的深链页；而 `/email/:id` 的 meta 是 **bottomNav: false**，
#   那页的树里根本没有 首页/笔记/消息 ⇒ 这条断言在该状态下**永远不可能通过**。
#
#   ⇒ 不能假设起点是 #/ai。要先把底部导航变出来。
#   「返回」是 canGoBack 页的通用出口（EmailDetailView 的返回按钮 aria-label=返回）。
- runFlow:
    when:
      notVisible: "首页"
    commands:
      - tapOn: "返回"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "首页"
    timeout: 30000
- assertVisible: "首页"
- assertNotVisible: "密码登录"

# ---------- 1. 底部导航切到「消息」 ----------
# ⚠️ MIUI 会吞掉底部导航的 tap：报 COMPLETED 但界面没动
#   （2026-10-03 15:06 在 settings-llm-gateway 上实测，失败现场仍停在首页）。
#   retryTapIfNoChange 管第一次，runFlow 补点管第二次，两个都要。
- tapOn:
    text: "消息"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "全部.*"
    timeout: 40000
- runFlow:
    when:
      notVisible: "邮件.*"
    commands:
      - tapOn: "消息"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "邮件.*"
    timeout: 30000

# ---------- 2. 核心断言：chips 齐全 ----------
# ⚠️ 2026-10-03 15:36 实测修正：chip 的**可见文本带未读计数**，实测是
#   「全部 88」「邮件 30」「订阅」「任务 58」——chip 与数字被 WebView 并成
#   一个节点。写成字面「全部」必然匹配不上（Maestro 的 visible 是整串全匹配）。
#   ⇒ 一律写成 `锚点.*` 容忍后缀计数。
#   注意「订阅」实测**没有**计数（该来源暂无未读），所以它不能用 `订阅.*` 之外
#   的任何假设；「全部.*」在计数为 0 时会退化成「全部」，那也仍然匹配。
- assertVisible: "全部.*"
- assertVisible: "邮件.*"
- assertVisible: "订阅"
- assertVisible: "任务.*"

# ---------- 3. 列表与空态必须二选一（两者皆无 = 白屏）----------
# 用 runFlow 把「有行」的情形记下来，再断言「没有行」时不成立。
# 只写「不得同时为空」在 Maestro 里表达不了，于是反过来写两条可判的：
#   · 空态文案若出现，则必须带着它的说明句（半截文案 = 渲染坏了）
#   · 两段式判断留给下面的 conditional
- runFlow:
    when:
      visible: "没有新消息"
    commands:
      - assertVisible: "重要邮件、订阅新闻和任务消息会汇总到这里"
      - takeScreenshot: "logs/maestro/messages-hub-empty"

# ---------- 3.5 两条 UI 层不变量（2026-10-03 真机实测后追加）----------
# **位置与写法都很要紧，两个坑都踩过，记录在这里防止有人再犯：**
#
# ① 必须在第 4 段「切到邮件来源」**之前**。带这两个毛病的行都是**任务行**（通知行），
#    而第 4 段点了「邮件.*」chip 会把它们全滤掉 —— 断言于是对着一个干净列表恒绿。
#    第一版就放错了位置，flow 2/2 通过，而它当时是失明的。
#
# ② 正则必须**前后都带 `.*`**。Maestro 的文本匹配是**整串全匹配**（本文件第 2 段
#    已经记过「chip 与数字被 WebView 并成一个节点」，第 73-84 行的 `全部.*` 就是这个原因）。
#    行节点的文本是「未读 + 图标 + 来源 + 标记 + 时间 + 标题 + 副标题」拼起来的长串，
#    `email\.[a-z]+` 这种没有 `.*` 包裹的模式只能匹配「整个节点文本恰好等于它」的节点 ——
#    不存在 ⇒ 断言恒绿。第一版又踩了一次这个。
#
# 3.5.1 assertNotVisible: '.*email\.[a-z]+.*'
#     实测：消息页**每一行**通知下面都显示 `email.important` ——
#     /api/notifications 50 条的 kind 全部是 'email.important'。
#     根因是 MessagesHubView 原来 `subtitle: n.kind || n.source || ''`，
#     把服务端内部分类键当成了展示文案。已修（features/messages/sourceLabels.ts）。
#     这里取**子串**匹配是有意的：任何祖先容器只要含这串就会命中，
#     而它含这串正是因为行里真的有它。
- assertNotVisible: '.*email\.[a-z]+.*'
#
# 3.5.2 【暂时停用 · 2026-10-03】assertNotVisible: '.*(Content-Transfer-Encoding|------=_Part_).*'
#     这条断言本身是对的 —— 它在未修复的构建上如实报红过（判据有牙齿已证）。
#     停用是因为它反映的是**一个还没修完的问题**，挂在主干上会让整条 flow 常红。
#     下面是实测到的完整因果链，修好之前不要打开它：
#
#       1) 原始症状：邮件预览显示 boundary + 分片头 + 未解码的 quoted-printable。
#       2) 后端 DeriveSnippet 已收口（先剥尾部 boundary 再判 containsMIMESource），
#          **新同步的邮件不再泄漏** —— 这条已用真实语料验证（snippet_flattened_part_regression_test.go）。
#       3) 但存量行治不好。实测 2026-10-03 19:0x：库里仍有 10 行是原始 MIME
#          （09-23 ~ 10-03，两个账户）。跑 POST /api/email/backfill 重算后**仍然是它们**。
#          原因不是修复无效，而是两个规则叠在一起：
#            · backfill 对这些邮件的抓取是**残缺**的（只拿到分片头/半截），
#              于是修好的 DeriveSnippet 正确地返回**空串**；
#            · 而 upsert 是
#                snippet = CASE WHEN EXCLUDED.snippet <> '' THEN EXCLUDED.snippet
#                               ELSE emails.snippet END
#              —— **空串意味着「不覆盖」**，旧的那条坏摘要因此被原样冻结。
#          ⇒ 不是「后端拿不到正文」。**2026-10-03 21:0x 进一步实测订正**：
#            `fetchSnippetOnConnected` 把**未压平**的 bs.Bytes 直接交给 DeriveSnippet
#            （不是压平问题），真正的原因是 IMAP 的 BODY[TEXT] 对这类邮件返回的是
#            **带分片头、没有完整报文**的形态 —— mimeCandidates 剥不掉，
#            任何 MIME 解析都取不出正文。
#            同时：邮件**详情页正文是干净的**（走完整正文缓存，10 行里已有 8 行有缓存），
#            坏的**只有列表摘要**。⇒ 要么摘要改从完整正文缓存派生，
#            要么抓取时对这种形态补一次 BODY[]。这是 fetcher.go 层的改动。
#      在那之前，UI 上仍会看到这 10 封的原始 MIME —— 这是**已知未修**，
#      不是回归。修好之后把下面这行取消注释即可。
# - assertNotVisible: '.*(Content-Transfer-Encoding|------=_Part_).*'

# ---------- 4. 切到「邮件」来源，验证 chips 真的在切数据 ----------
# chip 带未读计数（实测「邮件 30」），所以点击目标与断言都要容忍计数。
- tapOn: "邮件.*"
- extendedWaitUntil:
    visible: "全部.*"
    timeout: 25000
- assertVisible: "邮件.*"
- takeScreenshot: "logs/maestro/messages-hub-email"

# ---------- 5. 负向锚点 ----------
# 部分来源加载失败是这个页面自己会渲染的状态（src-error），不该被静默吞掉；
# 但「白屏」不是合法状态，上面的 chips 断言已经守住。
- assertNotVisible: "密码登录"

# ---------- 6. 常驻条能进邮箱 ----------
# 「打开邮箱」是消息 tab 通向邮件的出口，在 nav[aria-label=消息] 里。
# 必须放在**最后**：它会把页面导航到 #/email，之后再断言消息页就没意义了。
# 常驻条带 counts 门控（无数据时不存在），所以先判它在不在再点，
# 免得把「没数据」报成「出口坏了」。
- runFlow:
    when:
      visible: ".*打开邮箱.*"
    commands:
      - tapOn:
          text: ".*打开邮箱.*"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "邮箱"
          timeout: 30000
      - assertVisible: "邮箱"
