# 测试场景：已登录用户通过邮箱验证码修改密码
#
# 前置条件：
#   - 用户已登录
#   - 用户有邮箱（POCKET_TEST_EMAIL）
#   - SMTP_DEBUG_ECHO=true（开发环境回显验证码）
#
# 环境变量：
#   POCKET_TEST_EMAIL    - 测试用户邮箱
#   POCKET_OLD_PASS      - 旧密码
#   POCKET_NEW_PASS      - 新密码
#   POCKET_MASTER        - 主密码（解锁用）
#
# 测试步骤：
#   1. 登录并确保已解锁
#   2. 导航到修改密码页面
#   3. 输入邮箱并发送验证码
#   4. 等待验证码（debug 模式会在页面显示）
#   5. 输入验证码和新密码
#   6. 提交修改
#   7. 验证自动退出登录
#   8. 使用新密码重新登录
#   9. 恢复旧密码（清理）
appId: com.kaixuan.opencode.pocket
---

# 步骤 1: 确保已登录并解锁
- runFlow: _login.yaml

# 步骤 2: 打开菜单导航到设置
- tapOn: "打开菜单|Open menu"
- tapOn: "更多|More"
- extendedWaitUntil:
    visible: ".*设置.*|.*Settings.*"
    timeout: 10000

# 步骤 3: 在浏览器中直接导航到修改密码页面
# 注意：如果设置页面没有"修改密码"入口，我们直接导航到 URL
- evalScript: |
    window.location.hash = '#/change-password';
    return true;

# 步骤 4: 等待修改密码页面加载
- extendedWaitUntil:
    visible: ".*修改密码.*"
    timeout: 10000

# 步骤 5: 输入邮箱
- tapOn:
    text: "邮箱"
    index: 0
- inputText: ${POCKET_TEST_EMAIL}

# 步骤 6: 发送验证码
- tapOn: "发送验证码"
- extendedWaitUntil:
    visible: ".*调试模式：验证码.*|.*重新发送.*"
    timeout: 10000

# 步骤 7: 获取调试验证码
# 在 debug 模式下，验证码会显示在页面上：<code>123456</code>
- tapOn:
    text: ".*验证码.*"
    index: 0

# 步骤 8: 输入验证码（使用固定测试验证码）
# 注意：在实际测试中，你可能需要从页面抓取验证码
- inputText: "123456"

# 步骤 9: 输入新密码
- tapOn:
    text: ".*新密码.*"
- inputText: ${POCKET_NEW_PASS}

# 步骤 10: 确认新密码
- tapOn:
    text: ".*确认密码.*"
- inputText: ${POCKET_NEW_PASS}
- hideKeyboard

# 步骤 11: 提交修改
- tapOn: "修改密码"

# 步骤 12: 等待成功提示
- extendedWaitUntil:
    visible: ".*密码修改成功.*"
    timeout: 10000

# 步骤 13: 等待自动退出到登录页
- extendedWaitUntil:
    visible: ".*密码登录.*|.*Password.*"
    timeout: 15000

# 步骤 14: 验证已退出（打开菜单按钮不可见）
- assertNotVisible: "打开菜单|Open menu"

# 步骤 15: 使用新密码重新登录
- tapOn:
    text: ".*用户名.*|.*Username.*"
- inputText: "admin"
- tapOn:
    text: ".*密码.*|.*Password.*"
- inputText: ${POCKET_NEW_PASS}
- hideKeyboard
- tapOn: "登录|Sign In"

# 步骤 16: 等待登录成功
- extendedWaitUntil:
    visible: ".*打开菜单.*|.*Open menu.*"
    timeout: 30000

# 步骤 17: 处理主密码弹窗（如果有）
- runFlow:
    when:
      visible: ".*创建主密码.*|.*Create Master Password.*"
    file: _set-master-password.yaml

# 步骤 18: 验证登录成功
- assertVisible: "打开菜单|Open menu"

# 清理步骤：恢复旧密码
# 注意：这是为了让后续测试能继续使用原密码
- evalScript: |
    window.location.hash = '#/change-password';
    return true;

- extendedWaitUntil:
    visible: ".*修改密码.*"
    timeout: 10000

- tapOn:
    text: "邮箱"
    index: 0
- inputText: ${POCKET_TEST_EMAIL}
- tapOn: "发送验证码"
- extendedWaitUntil:
    visible: ".*调试模式：验证码.*|.*重新发送.*"
    timeout: 10000

- tapOn:
    text: ".*验证码.*"
    index: 0
- inputText: "123456"
- tapOn:
    text: ".*新密码.*"
- inputText: ${POCKET_OLD_PASS}
- tapOn:
    text: ".*确认密码.*"
- inputText: ${POCKET_OLD_PASS}
- hideKeyboard
- tapOn: "修改密码"

- extendedWaitUntil:
    visible: ".*密码修改成功.*"
    timeout: 10000
