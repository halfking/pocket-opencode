appId: com.kaixuan.opencode.pocket
---
# Comprehensive feature test for OpenPocket

- launchApp:
    clearState: true

# === LOGIN TEST ===
- extendedWaitUntil:
    visible: "AI Work Mess"
    timeout: 15000

- tapOn: "密码登录"
- inputText: "admin"
- tapOn:
    text: ".*输入 密码.*"
- inputText: "Veritrans&9527"
- tapOn: "登录"

- extendedWaitUntil:
    visible: ".*"
    timeout: 10000
- takeScreenshot: "01-after-login"

# === NAVIGATION TEST ===
- tapOn: "首页|Home"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "02-home-tab"

- tapOn: "笔记|Notes"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "03-notes-tab"

- tapOn: "消息|Messages"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "04-messages-tab"

- tapOn: "更多|More"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "05-more-tab"

# === SETTINGS TEST ===
- tapOn: "设置"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "06-settings-view"
- back
- extendedWaitUntil:
    visible: ".*"
    timeout: 1000

# === EMAIL TEST ===
- tapOn: "更多|More"
- extendedWaitUntil:
    visible: ".*"
    timeout: 1000
- tapOn: "邮箱"
- extendedWaitUntil:
    visible: ".*"
    timeout: 3000
- takeScreenshot: "07-email-view"
- back
- extendedWaitUntil:
    visible: ".*"
    timeout: 1000

# === NOTES & RECORDING TEST ===
- tapOn: "笔记|Notes"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- tapOn: "\\+"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "08-note-create"

- tapOn: "开始录音"
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000
- tapOn: "停止录音"
- extendedWaitUntil:
    visible: ".*"
    timeout: 3000
- takeScreenshot: "09-recording-complete"
- back
- extendedWaitUntil:
    visible: ".*"
    timeout: 1000

# === ACC/TASKS TEST ===
- tapOn: "更多|More"
- extendedWaitUntil:
    visible: ".*"
    timeout: 1000
- scroll
- extendedWaitUntil:
    visible: ".*"
    timeout: 1000
- takeScreenshot: "10-more-scrolled"

# Final state
- tapOn: "首页|Home"
- extendedWaitUntil:
    visible: ".*"
    timeout: 2000
- takeScreenshot: "11-final-home"
