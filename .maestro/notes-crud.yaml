# Maestro 真机功能流 · 笔记完整 CRUD
#
# 运行：
#   node scripts/maestro-run.mjs .maestro/notes-crud.yaml
#   启动器负责：确保 maestro driver 就位（--no-reinstall-driver）、
#   确定性重启 App、并注入登录/解锁口令。flow 内部只管跑子流程。
#
# 2026-10-01 真机首次跑通时的修正（都是这条 flow 从没跑过导致的）：
#   1) 笔记**不在 AI 工具页上**，入口是 底部「更多」→ 九宫格「PKM笔记」，
#      路由是 #/pkm/*（不是 #/notes）。
#   2) 旧版写的是 tapOn(id: "notes-action", index: 1)，而 notes-action 在
#      NoteListView.vue 里是 **CSS class 不是 id**，永远匹配不到。
#   3) 不要断言「全部正常」——TasksView 分诊条标签，只在无待处理任务时出现，
#      且 <380px 窄屏被 CSS 隐藏（TasksView.vue:1443）。真机视口正好 360px。
#   4) 断言/选择器文本里不要放 emoji（📝 ✓ ✎ 🗑）——Java 正则会抛异常判 false。
#      本文件统一用纯中文子串。
#   5) 详情页默认只读，必须先点「编辑」才出现 textarea。
#   6) 弹窗里的「删除」与工具栏的「删除」同名，用 index 区分。
appId: com.kaixuan.opencode.pocket
---
- runFlow: _login.yaml
- runFlow: _goto-pkm.yaml

# ---- 新建 ----
- tapOn: "新建笔记"
- extendedWaitUntil:
    visible: "一句话概括"
    timeout: 20000
- tapOn: "一句话概括"
- inputText: "Maestro笔记"
- tapOn: "全屏编辑"
- inputText: "由Maestro创建"
- tapOn: "创建"
- extendedWaitUntil:
    visible: "Maestro笔记"
    timeout: 25000
- assertVisible: "Maestro笔记"

# ---- 编辑（详情页先切编辑态）----
- tapOn: "Maestro笔记"
- extendedWaitUntil:
    visible: "编辑"
    timeout: 20000
- tapOn: "编辑"
- extendedWaitUntil:
    visible: "全屏编辑"
    timeout: 20000
- tapOn: "全屏编辑"
- inputText: "已编辑"
- tapOn: "保存"
- extendedWaitUntil:
    notVisible: "全屏编辑"
    timeout: 25000

# ---- 删除（含二次确认）----
- tapOn: "删除"
- extendedWaitUntil:
    visible: "取消"
    timeout: 15000
- tapOn:
    text: "删除"
    index: 1
- extendedWaitUntil:
    notVisible: "Maestro笔记"
    timeout: 25000
- assertNotVisible: "Maestro笔记"
