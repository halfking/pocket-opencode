appId: com.kaixuan.opencode.pocket

commands:
  # 1. 应用启动
  - launchApp:
      clearState: true
  
  - wait:
      ms: 3000

  # 2. 导航到笔记tab
  - tapOn:
      text: 笔记
      timeoutMs: 5000
  
  - wait:
      ms: 2000

  # 3. 创建新会议
  - tapOn:
      text: "+"
      timeoutMs: 3000
  
  - wait:
      ms: 1000

  # 4. 输入会议名称
  - inputText:
      text: "Phase2_Paraformer_Test"
  
  - wait:
      ms: 1000

  # 5. 确认创建
  - tapOn:
      text: 确认
      timeoutMs: 3000
  
  - wait:
      ms: 2000

  # 6. 开始录音
  - tapOn:
      text: 开始录音
      timeoutMs: 5000
  
  - wait:
      ms: 2000

  # 7. 验证录音已开始 (显示停止按钮)
  - assertVisible:
      text: 停止录音
      timeoutMs: 3000

  # 8. 等待180秒 (3分钟) - 用户需要说话进行真实语音测试
  # 这是手动功能验证，需要真实语音输入来测试 Paraformer
  - wait:
      ms: 180000

  # 9. 停止录音
  - tapOn:
      text: 停止录音
      timeoutMs: 5000
  
  - wait:
      ms: 3000

  # 10. 验证转写完成
  - assertVisible:
      text: 笔记
      timeoutMs: 10000

  # 11. 保存结果截图
  - takeScreenshot:
      fileName: phase2-paraformer-verification
