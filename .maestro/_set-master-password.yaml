# 子流程：处置 D 态「创建主密码」弹窗（被 _login.yaml 在两处 runFlow 引用）
#
# 为什么要独立成文件：同一个条件要在 _login.yaml 里判断**两次**——
#   ① 开头（上一轮 run 死在 D 态、弹窗留在屏幕上）
#   ② C 分支登录之后（LoginView 登录成功时若 hasMasterPassword=false 会弹）
# 内联写两遍必然有一份日后改漏，所以抽出来只维护一份。
#
# ⚠️ 必须用与现有本地加密库**相同**的主密码。
#    hasMasterPassword 只是 localStorage 里的 pocket_crypto_cfg 标志
#    （stores/crypto-config.ts），后端无记录。标志一丢，本地 SQLCipher 库却还在，
#    此时若换一个主密码：local-db.ts:138 的 setEncryptionSecret 会抛错并被
#    catch 掉（按「假定密码一致」处理），DB 实际仍用旧密钥，
#    而 UI 会认为主密码已创建 ⇒ 用户下次解锁要旧密码，事实上锁死。
#    详见 handoff §4.74 BUG-AV。
#
# ★ 2026-11-25 改为按 **resource-id** 定位，不再用坐标。
#   原来用坐标（50%,46% / 50%,53%，取自 720x1640 实机导出）有两个致命问题：
#     ① 坐标随视口高度/软键盘/弹窗动画漂移 ⇒ 模拟器 1080x2400 上第一个框
#        压根没被聚焦，inputText 落空 ⇒ 提交报「主密码至少需要 8 位」。
#     ② placeholder（hint）**不进 a11y 树的 text** ⇒ Maestro 也没法按文案点。
#   现在 MasterPasswordDialog.vue 的三个 input 都有 id 了
#   （master-password-input / master-password-confirm / master-password-hint，
#     与 LoginView 的 sso-direct-username / sso-direct-password 同一思路），
#   Maestro 可直接 tapOn: { id: ... }，与分辨率、与键盘、与动画全部无关。
#
#   ⚠️ 若 Maestro 版本较老、识别不到 id，退回坐标（实测 1080x2400 上的位置）：
#      主密码 input [112,1031][966,1134] 中心 (539,1082) → 50%,45%
#      确认密码 input [112,1162][966,1265] 中心 (539,1213) → 50%,51%
#      提示 input [112,1294][966,1396]（可选，跳过）
appId: com.kaixuan.opencode.pocket
---
# ★ Android WebView 不会将 DOM 的 data-testid 映射成 resource-id，
#   因此 id: 判据在此平台上恒假（2026-10-27 commit 5b05e4d3 验证）。
#   改用 index 定位：创建主密码弹窗中的输入框。
- tapOn:
    index: 0
- inputText: ${POCKET_MASTER}
- tapOn:
    index: 1
- inputText: ${POCKET_MASTER}
# ⚠️2026-11-25 实测：本项目 hideKeyboard 会触发系统导航（回车键模拟），
#    导致前台被切到别的应用（nsproxy/vpndialogs），后续 tapOn 全部落空。
#    改用 ENTER 键事件（input keyevent 66）—— 确认框绑了 @keyup.enter="submit"，
#    Enter 即提交（MasterPasswordDialog.vue）。
# ⚠️2026-11-25 实测：确认框绑了 @keyup.enter="submit"，
#    所以**回车即提交**，弹窗会立刻关闭 —— 之后再 tapOn "确认" 必然
#    Element not found（弹窗已经不在树里了）。这��点「确认」只能是可选项。
- pressKey: Enter
- tapOn:
    text: "确认"
    optional: true
# ⚠️2026-11-25 实测：提交后按钮进入 disabled 的「初始化中…」状态，
#    initLobster 要开 SQLCipher 库 + 加载向量索引，耗时可达数十秒。
#    必须先等「初始化中…」消失，再等主界面文案出现；
#    否则会在初始化中途就断言「打开菜单」→ 必然红。
- extendedWaitUntil:
    notVisible: ".*初始化中.*"
    timeout: 120000
# 弹窗必须真的关掉（Enter 提交 ≠ 一定成功：口令不一致会留在弹窗里报错）
- extendedWaitUntil:
    notVisible: ".*创建主密码.*"
    timeout: 60000
# ★ 中英并列：「打开菜单」是**走 i18n** 的 header aria-label
#   （locales/zh-CN.json → "openMenu": "打开菜单"；en-US 对应 Open menu），
#   单写中文在 en-US 设备上必然超时。
- extendedWaitUntil:
    visible: ".*打开菜单.*|.*Open menu.*"
    timeout: 90000
- assertNotVisible: ".*创建主密码.*"
