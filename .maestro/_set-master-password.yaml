# 子流程：处置 D 态「创建主密码」弹窗（被 _login.yaml 在两处 runFlow 引用）
#
# 为什么要独立成文件：同一个条件要在 _login.yaml 里判断**两次**——
#   ① 开头（上一轮 run 死在 D 态、弹窗留在屏幕上）
#   ② C 分支登录之后（LoginView 登录成功时若 hasMasterPassword=false 会弹）
# 内联写两遍必然有一份日后改漏，所以抽出来只维护一份。
#
# ⚠️ 必须用与现有本地加密库**相同**的主密码。
#    hasMasterPassword 只是 localStorage 里的 pocket_crypto_cfg 标志
#    （stores/crypto-config.ts），后端无记录。标志一丢，本地 SQLCipher 库却还在，
#    此时若换一个主密码：local-db.ts:138 的 setEncryptionSecret 会抛错并被
#    catch 掉（按「假定密码一致」处理），DB 实际仍用旧密钥，
#    而 UI 会认为主密码已创建 ⇒ 用户下次解锁要旧密码，事实上锁死。
#    详见 handoff §4.74 BUG-AV。
#
# ⚠️ 三个输入框在无障碍树里 **text 全是空**（type=password 且无 content-desc），
#    placeholder 不进 a11y 树 ⇒ 没法按文案点，只能按坐标。
#    坐标来自 720x1640 实机导出（scripts/read-maestro-hierarchy.mjs 读的
#    ~/.maestro/tests/2026-10-01_121046/.../step-005-*.json）：
#      弹窗 [40,480][680,1160]，高 680，视口 1640 → (1640-680)/2=480 垂直居中，位置稳定
#      主密码 input [88,718][632,800]  中心 (360,759) → 50%,46%
#      确认密码 input [88,822][632,906] 中心 (360,864) → 50%,53%
#      提示 input [88,928][632,1010]（可选，跳过）
#      确认 button [506,1032][632,1112]（按文案点，不写坐标）
appId: com.kaixuan.opencode.pocket
---
- tapOn: { point: "50%,46%" }
- inputText: ${POCKET_MASTER}
- tapOn: { point: "50%,53%" }
- inputText: ${POCKET_MASTER}
- hideKeyboard
- tapOn: "确认"
# initLobster 要开 SQLCipher 库 + 加载向量索引，给足时间
- extendedWaitUntil:
    visible: "打开菜单"
    timeout: 90000
- assertNotVisible: "创建主密码"
