appId: com.kaixuan.opencode.pocket

commands:
  - launchApp
  - extendedWaitUntil:
      visible: ".*"
      timeout: 3000
  - tapOn: "笔记|Notes"
  - extendedWaitUntil:
      visible: ".*"
      timeout: 2000
  - tapOn: "\\+"
  - extendedWaitUntil:
      visible: ".*"
      timeout: 1000
  - tapOn: "开始录音"
  - extendedWaitUntil:
      visible: ".*"
      timeout: 15000
  - tapOn: "停止录音"
  - extendedWaitUntil:
      visible: ".*"
      timeout: 3000
  - takeScreenshot: phase-test-result.png
