# Maestro 真机功能流 · ACC 派单的审批环（2026-10-26 审计轮新增 / 当日再修两次）
#
# 这条流守的是「委托给 ACC」这条链路**最后一跳**：智能体要工具批准时，
# 人必须在手机上能看到并应答，否则任务永远 permission_denied。
#
# ★ 根因（2026-10-26 实测，不是推测）：
#   agent-companion 的 ACP 权限门把审批转发给 ACC 的
#   POST /api/v2/runtime/commands/{dispatch_id}/permission，
#   而 **acc-go 从未实现这条路由**（对权威 ACC 实测 GET/POST 都 404；
#   agent-companion 自己的 ACC_BRIDGE_SPEC.md 却写着这条 —— 契约在，实现没有）。
#   ⇒ 修复：ACC 端点未接线时，待批项停进 daemon 自己的干预队列等人应答；
#     没人应答仍然 fail-closed。
#   ⇒ 本流验的就是「App 看得到待批项 ⇒ 点允许 ⇒ 智能体继续跑完 ⇒ 卡片进已结束区」。
#
# ★ 为什么前提由夹具造（scripts/acc-approval-fixture.mjs）：
#   弹窗里的输入框在无障碍树里是 `[EditText] t="" cd=""` ⇒ 只能按坐标点，
#   而弹窗内容一变坐标就位移（实测：sheet 顶部从 y≈1200 变成 y=0）。
#   「委托给 ACC」的设备侧链路由 .maestro/acc-delegate-stop.yaml 覆盖；
#   这条流只验审批面。
#
# ★ 2026-10-26 12:30 这一版修掉的三个**判据缺陷**（都是真问题，不是玄学）：
#
#   ① 「答一轮就够」是错的：智能体连问好几轮。
#      实测（daemon 日志，同一次派单 dispatch_d83b0a39…）：
#        12:26:28 parking "ls -d /tmp/maestro-acc-approve …"
#        12:27:22 answered locally           ← 设备上点「允许一次」真的到了 daemon
#        12:27:27 parking "mkdir -p /tmp/maestro-acc-approve && …"  ← 第二轮又来
#        12:29:27 permission denied (fail-closed) ← 第二轮没人答 ⇒ 超时 ⇒ 任务死
#      ⇒ 只答一轮 ⇒ 卡片不会消失（下一轮又挂上）⇒ `notVisible` 必红。
#      ⇒ 现在**循环应答**，直到待批卡片不再出现。
#
#   ② `visible: "已完成"` 是**恒真**判据：
#      「已完成」三个字只出现在**分区标题**里（<h2>已完成<span>1</span></h2>），
#      任务卡片自己只写标题 + 相对时间（task-title done / timeAgo），
#      压根不写「已完成」⇒ 那条断言在任何时刻都成立
#      （实测失败现场的无障碍树里就有「已完成 1」—— 那是**别的**已完成任务）。
#      ⇒ 现在断言改成**定位到本条卡片**：id=finished-task-title-completed + text=标题。
#      （标题的 testid 带状态后缀：断言「这条任务已完成」和「这条任务失败」
#        是两件事，共用一个 testid 就分不出来。）
#
#   ③ 「已结束」分区**默认折叠**（showCompleted = ref(false)）⇒ 卡片根本不渲染
#      ⇒ 断言无从命中 ⇒ 必须先展开分区（data-testid="completed-section-toggle"）。
#
# ★ 2026-10-26 20:5x 这一版修掉的**真缺陷**（设备现场取证，不是猜的）：
#
#   ④ 一次危险工具调用会让 opencode **连发 2~3 个审批请求**，而且是**同一个
#      toolCallId**。daemon 帧日志实测（一次派单）：
#        id=0「写路径检查」(kind=other, rawInput 带 directories/patterns)
#        id=1「执行检查」  (kind=execute, rawInput 只有 command)   ← 20ms 后
#        id=2「读检查」    (kind=other, 读文件)
#      每个都要单独应答；漏一个就 120s 超时 fail-closed。
#      ⇒ 「答一条 ⇒ 列表清空 ⇒ 下一条又来」是**常态** ⇒ 必须循环应答，
#        而且循环次数要够（这里 10 轮，实测最多 3 轮）。
#
#   ⑤ App 侧的 ACC 待批 <section> 原来挂着 v-if（列表空 ⇒ 整段被卸载，
#      下一条待批到达 ⇒ 又重建）。Android WebView 的无障碍树在「节点被卸载后
#      同位置重建」时会**丢一整段子树**：attempt9 现场，同一时刻
#        · 截图：卡片和「允许一次」按钮**在屏幕上**；
#        · uiautomator 快照：main 的子节点从「下拉同步邮件」直接跳到「ACC 生态」
#          —— 中间整个 section 节点**不见了**。
#      ⇒ Maestro 点不到那张卡（visible 断言连 WARNED）⇒ 人被迫再等 120s
#        ⇒ 任务被判失败。这**不是测试专属问题**：TalkBack 用户同样看不到卡片。
#      ⇒ 修法（App 侧）：section 元素常驻 DOM + 列表加 aria-live="polite"。
#      ⇒ 本流就是它的判据：连答 2~3 张卡必须全绿。
#
# 运行：node scripts/maestro-run.mjs .maestro/acc-approval.yaml
appId: com.kaixuan.opencode.pocket
---
# ---------- 0. 前置：夹具已造出「正在等审批」的派单，起点是 #/ai ----------
- extendedWaitUntil:
    visible: "AI 工具"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000

# ---- 0.5 ~~展开「已结束」分区~~ ----
#
# ★ 2026-10-27 01:54 这一版**删掉**了原来放在开头的「展开已结束分区」块 ——
#   它有三个缺陷，每一个都能让末尾断言**必然红**，而且红得看不出原因：
#
#   ① **不等待**：App 的任务列表是异步加载的。01:54 那轮实测：
#      0.5 步在 01:54:00 判定 `completed-section-toggle` **不可见**
#      ⇒ `when: visible` 不成立 ⇒ 整块 **SKIPPED**（commands.json seq=4）
#      ⇒ 分区一直折叠 ⇒ 末尾断言「卡片可见」永远打不到。
#      ⇒ 展开动作必须**放到末尾**、并且**先等分区出现**。
#   ② **判据用错了对象**：原来用「有没有 `finished-task-title-completed`」
#      判断要不要展开。但「这一张卡片还没完成」和「分区是折叠的」是两件事
#      ⇒ 分区**已经展开**、只是本条还没完成时，它会判定为「折叠」
#      ⇒ 一拍把分区**点回折叠** ⇒ 末尾断言反而被自己搞红。
#   ③ 分区默认折叠（`showCompleted = ref(false)`）⇒ 卡片**根本不渲染**
#      ⇒ 断言只能打在渲染出来的节点上。
#
# ⇒ 现在在末尾（步骤 4）做：先等分区出现 ⇒ 若「没有任何已结束卡片」就展开
#   ⇒ 再断言本条卡片。

# ---- 1. ★ 待批卡片必须出现 ----
# 「ACC 待批（1）」里的括号数字会变 ⇒ 判据写正则（Maestro 的 visible 是
# 完整匹配，「ACC 待批」匹配不上「ACC 待批（1）」——与 acc-delegate-stop.yaml
# 里同一个坑）。
- extendedWaitUntil:
    visible: "ACC 待批.*"
    timeout: 90000
- assertVisible: "ACC 待批.*"

# ---- 2. ★ 必须能应答（★ 循环应答：一次工具调用会连问 2~3 轮）----
# option id 取智能体给过的那一个；找不到就没有这个按钮
# （渲染一个必然被 daemon 拒的按钮是假动作）。
#
# 每轮：先**等**下一条待批项冒头（App 轮询 5s 一跳）→ 有点就点
# → 再等它被划掉。
# ⚠ 顺序不能反：把「点」放在前面、等待放在后面，而「等出现」在卡片
#   **还没消失**时会立即返回 ⇒ 迭代在几秒内烧完（第一版的坑）。
# ⚠ 「等消失」超时是**正常**的：下一条待批项顶上来时按钮并没有消失，
#   只是换了一条 ⇒ 这一步只是节奏控制，不承担判定职责（optional: true）。
#   真正的判定在第 4 步：任务必须真的跑完。
- repeat:
    times: 10
    commands:
      # ① **先等**下一条待批项冒头（App 轮询 5s 一跳 ⇒ 15s 窗口足够）。
      - extendedWaitUntil:
          visible: ".*允许一次.*"
          timeout: 10000
          optional: true
      # ② 有点就点（没有就跳过，不算失败）
      - runFlow:
          when:
            visible: ".*允许一次.*"
          commands:
            - tapOn: ".*允许一次.*"
      # ③ 等这一条被划掉：store 在 POST 成功返回后立刻把它从列表里去掉
      #    （frontend/src/stores/accApprovals.ts 的 decide()）。
      - extendedWaitUntil:
          notVisible: ".*允许一次.*"
          timeout: 5000
          optional: true

# ---- 3. ★ 应答后待批卡片清空 ----
# 这一条证明应答真的到了 daemon：App 只是把本地列表里那一条去掉，
# 而 daemon 侧 pending 归零才是真话（后端读的是 daemon 的队列）。
- extendedWaitUntil:
    notVisible: "ACC 待批.*"
    timeout: 60000

# ---- 4. ★ 任务真的跑完并进了「已结束」区 ----
# 依赖后端的状态回填（tasksync 的 ACC 派单状态回填，15s 一跳）：
# 本地那一行的状态跟着 ACC 的命令面走，否则卡片永远停在「进行中」。
#
# ⚠ 这里**不**靠用户下拉刷新 —— 回填会广播 task_updated，卡片必须自己变。
#    刷新一下就能看见的状态不算数（那是用户替产品做了事）。
#
# ★★ 2026-10-27：**判据只能靠文本，`id:` 在这个平台上根本不成立**。
#
#   证据（Maestro 自己存下的无障碍树，2026-10-26 12:28 那轮）：
#     text = maestro-acc-stop
#     text = 已完成 1
#     ⇒ 树里**只有文本**；App 的 data-testid（finished-task-title-completed、
#        completed-section-toggle…）**没有**变成 resource-id
#        （树里的 resource-id 全是 Android 系统那几个）。
#   ⇒ 所以 `visible: {id: "completed-section-toggle"}` 这类判据**永远不成立**
#      —— 它不是「这次没赶上」，是**结构性的**：
#      Android WebView 不把 DOM 的 data-testid 映射成无障碍节点的 view id。
#   ⇒ 上一轮把「已完成」这个**恒真**判据换成 id 判据，等于把恒真换成了
#      **恒假** —— 两种都验不到东西。
#
#   现在全部改成**文本**判据：
#     · 「已结束 N」是分区标题（一个文本节点，N = 已结束任务数）；
#     · 每张已结束卡片带一个**状态标签**（已完成 / 已取消 / 已失败）；
#     · 任务标题本身也是文本节点。
#
#   判据怎么才不是恒真：
#     · 「已结束.*」只证明分区在，不证明本条在里面；
#     · 「已完成」只证明**某张**卡片已完成（历史里已有别的已完成卡片）；
#     · ⇒ 把两者**绑在一起**：状态标签必须是**本条标题的右边**那个
#       （rightOf）⇒ 只有这一条卡片满足。
# ⚠ 「已结束」分区在长页面的**最底部** ⇒ **不滚过去它就不在无障碍树里**
#   （WebView 只暴露已渲染的部分）⇒ 2026-10-27 02:31 那轮实测：
#   `Assertion is false: "已结束.*" is visible` ⇒ 等 180s 也等不到。
#   ⇒ 先滚到它，再做后面的事。
- scrollUntilVisible:
    element:
      text: "已结束.*"
    direction: DOWN
    timeout: 120000
# 分区默认折叠 ⇒ 卡片不渲染 ⇒ 状态标签也不在树里。
# ⇒ 只有在「一个状态标签都看不见」时（= 分区确实折叠着）才点标题展开；
#   否则会把**已经展开**的分区点回折叠（这正是 flow2 之前栽的那一跤）。
- runFlow:
    when:
      notVisible: "已完成|已取消|已失败"
    commands:
      - tapOn: "已结束.*"
- extendedWaitUntil:
    visible: "已完成"
    timeout: 60000
    optional: true
# 本条卡片可能已结束区底部 ⇒ 滚过去再断言。
- scrollUntilVisible:
    element:
      text: "maestro-acc-approve"
    direction: DOWN
    timeout: 120000
- assertVisible: "maestro-acc-approve"
- assertVisible:
    text: "已完成"
    rightOf:
      text: "maestro-acc-approve"
