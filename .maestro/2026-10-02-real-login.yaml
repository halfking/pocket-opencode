# 2026-10-02 真机登录 —— **实测跑不通，留档说明为什么**
#
# 结论先写前面：这条 flow 在真机上**必然红**，原因是环境限制而不是配置问题，
# 所以不要再花时间调它。2026-10-02 实测：第一条断言 "后端服务器 is visible" 转红。
#
# 真因：Capacitor WebView 对 uiautomator **完全不透明**。真机实测：
#   mCurrentFocus = com.kaixuan.opencode.pocket/.MainActivity（App 确实在前台）
#   uiautomator dump → 102 个节点，12 个非空 text：
#     日历 / QQ / 建悦里管家 / 微信 / 支付宝 / 中国建设银行 / OpenCode Pocket ...
#   —— 全是**桌面启动器**的图标，App 里的一个字都没有。
# Maestro 建立在 uiautomator 之上，看不见 App 的任何文本，
# 所以这里任何 assertVisible 都必然 false。`adb shell input text` 同样打不进去
# （点完 input 仍为空），登录页实测如此。
#
# 能跑通的那条路是 CDP：见 scripts/webview-eval.ps1 的用法，
# 以及 logs/real-device-20261002-190414/summary.md 里记录的完整过程
# （用 CDP 填 input + 点登录，登录成功进入 #/ai）。
#
# 下面保留本文件原文，仅作记录。
#
# 另外注意：scripts/maestro-run.mjs 的 preflight 会先做一次 CDP 复位路由，
# 随后 flow 的 launchApp 再 force-stop 一次；MIUI 上这两步叠加会把 App
# 留在后台不再拉起（preflight 自己会打印 "复位路由/等渲染未成功"）。
# appId: com.kaixuan.opencode.pocket
appId: com.kaixuan.opencode.pocket
---
# 断言用「后端服务器」这行：它只在登录页出现，且**直接显示 API 基址**，
# 顺带把「App 到底连的哪个后端」这条最常出错的判据一起钉住。
- extendedWaitUntil:
    visible: "后端服务器"
    timeout: 45000

- tapOn: "输入密码"
- inputText: ${POCKET_DEV_PASS}
- hideKeyboard

# 登录按钮在两个字段都非空时才 enabled（LoginView 的 disabled 绑定），
# 所以 enabled=true 同时证明密码真的落进了 input —— 比断言文本更稳。
- extendedWaitUntil:
    visible: { text: "登录", enabled: true }
    timeout: 20000
- tapOn: { text: "登录", enabled: true }

# 登录后有三种落点（见 .maestro/_login.yaml 顶部的 A/B/C/D 分析）：
# 打开菜单（进 App）、创建主密码（D 态弹窗）、解锁本地数据（B 态）。
- extendedWaitUntil:
    visible: "打开菜单|创建主密码|解锁本地数据"
    timeout: 90000
- takeScreenshot: "logs/maestro/2026-10-02-real-login"

# 硬判据：解锁页 / 登录页 / 建主密码弹窗，**登录成功后都不该还停在这**。
# 主密码弹窗由 _set-master-password.yaml 的 D-2 分支处理。
- assertNotVisible: "输入用户名"
