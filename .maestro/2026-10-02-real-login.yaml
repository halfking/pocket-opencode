# 真机登录流程（2026-10-03 按实测重写；2026-10-22 按实测再修）
#
# ⚠️ 旧版文件头（2026-10-02）写的是「这条 flow 在真机上必然红，原因是
# Capacitor WebView 对 uiautomator 完全不透明、Maestro 看不见 App 的任何文本」。
# **那条结论已被证伪，不要照它做决定**：2026-10-03 实测 Maestro 2.11 能读到
# App 的无障碍树——本轮多条 flow 都成功断言了 App 内的文本（「打开 PKM」
# 「今日 Daily Note」「主导航」「首页」等）。所以问题不在「看不见」，
# 而在**前提不成立**。
#
# 旧 flow 的第一句是 `assertVisible: 后端服务器`（只有登录页才有这行），
# 2026-10-03 实测在这里就红了。失败现场的无障碍树是：
#   AI 工具 / 快速提问 / 需要你介入 / 运行中 2 / 全部 2 …
# —— **App 已经登录并在首页**。原因：scripts/maestro-run.mjs 的 preflight
# 早就用 CDP 填过登录表单了，flow 启动时人根本不在登录页。
# 这不是「环境限制」，是流程没有考虑「可能已经登录过」。
#
# 后半段的判据也一并更正：旧写法里的「打开菜单」来自**早已删除的抽屉式菜单**
# （2026-09-05 抽屉收编成 MoreHubView，2026-10-03 一级导航又换成固定底部 tab），
# 留着它只会让这条判据永远等不到。
#
# ── 2026-10-22 本轮修的三处（都是**判据本身错了**，不是产品坏了）──────────
#
# ① 落点判据把「还停在登录页」也算成合法落点 ⇒ 登录失败被彻底掩盖。
#    旧写法：`visible: "创建主密码|解锁本地数据|密码登录"`。
#    实测：口令没被 Maestro 展开（`Inputting text: undefined`）⇒ 登录 401 ⇒
#    页面纹丝不动地停在登录页 ⇒ 上面那句里的第三个候选「密码登录」**恰好成立**
#    ⇒ 这条 extendedWaitUntil 照样 COMPLETED ⇒ 真正的失败被推迟到下游，
#    现场只剩一句「登录页还在」，把人引去查「为什么登录后又弹回登录页」。
#    ⇒ 落点集合里必须**去掉「密码登录」**：成功落点只有
#      ① 直接进 App（外壳 header 的 aria-label「打开菜单|Open menu」）
#      ② D 态主密码弹窗（「创建主密码」）
#      ③ B 态解锁屏（「解锁本地数据」）
#    「还在登录页」是**失败**，不是落点。
#
# ② 收尾硬判据 `assertNotVisible: "^密码登录$"` 在 D 态下**永远不成立**。
#    LoginView.handleLogin / completeAuth 在 `!cryptoConfig.cfg.hasMasterPassword`
#    时是 `showMasterPasswordDialog.value = true; return` —— **直接 return，
#    不跳 /ai**。而 MasterPasswordDialog 是**渲染在 LoginView 内部**的模态框
#    ⇒ D 态下登录页整棵树仍然在无障碍树里（被弹窗盖着）⇒
#    Maestro 的 visible 判定不区分遮挡 ⇒ 「登录页还在」为真。
#    ⇒ 修法：先把 D 态弹窗处置掉（跑 _set-master-password.yaml），
#      弹窗关闭后 LoginView 被 router.replace('/ai') 卸载 ⇒ 登录页才真正消失。
#      这条断言的含义因此从「本来就不成立」变成「登录确实成功离开了登录页」。
#
# ③ 登录手势链里 `${POCKET_DEV_PASS}` 的展开，2026-10-22 之前**从来没成功过**。
#    Maestro 的 `${VAR}` 只认**flow 自己 `env:` 块**里定义的变量，不读进程环境变量；
#    没有 env 块时它展开成字符串 "undefined"（实测日志：
#    `Inputting text: undefined`）⇒ 密码框里躺的是 "undefined" ⇒ 必然 401。
#    现在由 scripts/maestro-run.mjs 的 materializeFlowWithEnv 在跑前生成
#    临时 flow（前置区插 env 块，跑完删除）把它补上。
#    ⚠️ 别退回「用 --env 传」：那会把口令暴露在进程命令行里。
appId: com.kaixuan.opencode.pocket
---
# ---------- 登录段：只有在真的停在登录页时才走 ----------
# 「后端服务器」这行只在登录页出现，且顺带把「App 到底连的哪个后端」
# 这条最常出错的判据一起钉住——所以用它当条件，而不是当断言。
# ⚠️ 2026-10-07 实测：`runFlow when` 是**瞬时判定、不等待**的一步。
#   原来拿「后端服务器」当条件，而那行是异步渲染的：flow 启动那一刻它还没进树
#   ⇒ 分支被 **SKIPPED**（登录压根没执行），下一条断言「密码登录」却又成立
#   ⇒ 报错是「登录页还在」，看起来像登录失败，真因是**条件判定得太早**。
#
#   修法两处：① 前面先显式等页面落到「登录页或已登录首页」二者之一；
#            ② 条件改用**登录页最先渲染、最稳定的** tab 标签 ^密码登录$，
#               「后端服务器」那一行改放到登录成功后的断言里（它本来就是钉后端地址的）。
- extendedWaitUntil:
    visible: "^密码登录$|AI 工具"
    timeout: 45000
- runFlow:
    when:
      visible: "^密码登录$"
    commands:
      # ⚠️ 2026-10-07 实测：密码框**没有可按文本选中的节点**。
      #   失败现场整棵树里只有两个 EditText：
      #     EditText text='admin' bounds=[105,1218][973,1336]  ← 用户名，有值
      #     EditText text=None     bounds=[105,1430][973,1551]  ← 密码，**无文本**
      #   而标签「用户名」「密码」都是 android.view.View、clickable=false，不是输入框；
      #   旧写法用的「输入密码」是 placeholder，同样不在树里。
      #   ⇒ 只能按坐标，取它 bounds 的中心（屏 1080x2400）：
      #       x=(105+973)/2=539 → 50%；y=(1430+1551)/2≈1490 → 62%
      #   同一个改法已在 login-gesture.yaml 上真跑验证过（16 步全绿）。
      - tapOn:
          point: "50%,62%"
      - inputText: ${POCKET_DEV_PASS}
      - hideKeyboard
      # 登录按钮在两个字段都非空时才 enabled（LoginView 的 disabled 绑定），
      # 所以 enabled=true 同时证明密码真的落进了 input —— 比断言文本更稳。
      - extendedWaitUntil:
          visible: { text: "登录|Sign in", enabled: true }
          timeout: 20000
      - tapOn: { text: "登录|Sign in", enabled: true }

# ---------- 落点判据：登录成功 ⇒ 离开登录页 ----------
# ⚠️ 这三选一里**不能有「密码登录」**（见文件头 ①）：有它，登录失败也会过。
# 「打开菜单|Open menu」是已登录 App 外壳 header 的 aria-label（走 i18n：
# zh-CN「打开菜单」/ en-US「Open menu」），登录页与解锁页都没有它。
- extendedWaitUntil:
    visible: "打开菜单|Open menu|创建主密码|解锁本地数据"
    timeout: 60000

# ---------- D 态：登录成功但本机还没有主密码 ----------
# LoginView 登录成功后会弹「创建主密码」模态框并**停在登录页**（不跳 /ai），
# 所以这一步必须显式处置，处置完才会 router.replace('/ai)。
# ⚠️ `runFlow when` 是瞬时判定：上面那句 extendedWaitUntil 已经把落点等出来了，
#   这里再判不会「判得太早」。
- runFlow:
    when:
      visible: "创建主密码"
    commands:
      # ⚠️ 子流路径用**裸文件名**（与 _login.yaml 一致）：runFlow 的相对路径是
      #   按**当前 flow 所在目录**解析的，写成 `.maestro/xxx.yaml` 会被解析成
      #   `.maestro/.maestro/xxx.yaml` ⇒ 解析期就报 "Parsing Failed"，
      #   报错位置指向外层 runFlow，离真因很远。
      - runFlow: _set-master-password.yaml

# ---------- 落点终判 + 收尾硬判据 ----------
# 进 App 的唯一标志是外壳的「打开菜单|Open menu」。
# ⚠️ 这条超时 = 登录没有走到 App（没进外壳、也没弹主密码弹窗）。
#   失败现场的无障碍树会带出原因（例如「登录失败：用户名或密码错误」），
#   **别把它读成「App 坏了」**。
- extendedWaitUntil:
    visible: "打开菜单|Open menu"
    timeout: 90000
- assertVisible: "打开菜单|Open menu"
# 硬判据：登录成功后不该还停在登录页。
# ⚠️ 2026-10-07 实测：点完「登录」后**必须先等往返**。
#   原写法点完立刻断言，那一刻请求还在飞，登录页当然还在 ⇒ 报「登录失败」。
#   先等它消失，超时时长与下面的硬断言区分开：等的是**状态**，
#   断言是**结论**——两者不再共用同一条语句，所以失败时能看出是没等到还是等到了没成。
- extendedWaitUntil:
    notVisible: "^密码登录$"
    timeout: 45000
- assertNotVisible: "^密码登录$"
