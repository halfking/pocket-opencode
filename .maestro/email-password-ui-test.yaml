# 简化版测试：仅验证 UI 和页面导航
# 不依赖后端验证码功能
#
# 测试内容：
#   - 登录成功
#   - 导航到修改密码页面
#   - 验证页面元素显示
#   - 验证表单输入
#
appId: com.kaixuan.opencode.pocket
---

# 步骤 1: 确保已登录
- runFlow: _login.yaml

# 步骤 2: 导航到主界面
- extendedWaitUntil:
    visible: ".*打开菜单.*|.*Open menu.*"
    timeout: 10000

# 步骤 3: 通过 URL 导航到修改密码页面
- evalScript: |
    window.location.hash = '#/change-password';
    return true;

# 步骤 4: 等待修改密码页面加载
- extendedWaitUntil:
    visible: ".*修改密码.*|.*Change Password.*"
    timeout: 10000

# 步骤 5: 验证页面元素存在
- assertVisible: "邮箱|Email"

# 步骤 6: 测试邮箱输入
- tapOn:
    text: ".*邮箱.*|.*Email.*"
    index: 0
- inputText: "test@example.com"

# 步骤 7: 验证发送验证码按钮存在
- assertVisible: "发送验证码|Send code"

# 步骤 8: 尝试点击发送验证码（会失败但不会崩溃）
- tapOn: "发送验证码|Send code"

# 步骤 9: 等待一下，看是否有错误提示或状态变化
- evalScript: |
    return new Promise(resolve => setTimeout(resolve, 2000));

# 步骤 10: 验证页面仍然正常显示
- assertVisible: "修改密码|Change Password"

# 步骤 11: 测试表单输入验证
- tapOn:
    text: ".*新密码.*|.*New Password.*"
    optional: true
- inputText: "123"
- hideKeyboard

- tapOn:
    text: ".*确认密码.*|.*Confirm Password.*"  
    optional: true
- inputText: "456"
- hideKeyboard

# 步骤 12: 尝试提交（应该显示错误）
- tapOn:
    text: ".*修改密码.*|.*Change Password.*|.*提交.*"
    optional: true

# 步骤 13: 返回主界面
- evalScript: |
    window.location.hash = '#/ai';
    return true;

- extendedWaitUntil:
    visible: ".*打开菜单.*|.*Open menu.*"
    timeout: 10000

# 测试完成
- evalScript: |
    console.log('✅ UI 测试完成');
    return true;
