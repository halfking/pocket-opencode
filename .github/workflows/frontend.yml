name: frontend

# PR12 of optimization v4 (E6-S1).
# Boundary (per docs/优化v4/14-首批PR与执行顺序.md row 12):
#   - Run frontend typecheck, build, and the pure Node tests from
#     PR3, PR4, PR5, PR7, PR11 on every PR that touches frontend/**.
#   - Run the Android Gradle assemble task against frontend/android/,
#     which is the single Android build source per ADR-009. The root
#     android/ directory is intentionally ignored.
#   - Fail loudly when node_modules or gradle cache is missing; do
#     not use continue-on-error to mask P0 regressions.

on:
  push:
    branches: [main, feat/**, docs/audit-opt-v4-plan-fixes]
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - "test-evidence/PR11/**"

permissions:
  contents: read

jobs:
  frontend-lint:
    name: typecheck + build + node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # vue-tsc --noEmit; the same command docs/优化v4/02-安全审计与整改清单.md
        # §5 records as the historical gate.
        run: npm run typecheck

      - name: Build
        # BUG-D 的守卫会对空 VITE_API_BASE 拒绝构建（移动端 bundle 缺基址会静默
        # 回落到 WebView 同源）。CI 这一步是丢弃产物的冒烟构建，不进任何 APK，
        # 因此走 build:gate（仅此路径开逃生舱）。`build:fast` 本身仍受守卫保护。
        run: npm run build:gate

      - name: Run pure helper tests (PR3)
        run: node --test src/utils/__tests__/asyncState.test.mjs

      - name: Run route guard tests (PR4)
        run: node --test src/app/__tests__/routeGuards.test.mjs

      - name: Run idempotent WS bus tests (PR5)
        run: node --test src/services/__tests__/idempotentWsBus.test.mjs

      - name: Run session state helper tests (PR7)
        run: node --test src/composables/__tests__/useSessionState.test.mjs

      - name: Run task health model tests (P0 mobile UX)
        run: node --test src/features/tasks/__tests__/health.test.mjs

      - name: Run fault injection harness (PR11)
        run: node ../test-evidence/PR11/fault-injection.mjs

      - name: Run HarmonyOS runtime guard tests
        run: node --test src/native/__tests__/runtime-platform.test.mjs src/native/__tests__/capabilities-harmony.test.mjs

      - name: Run email content-first helper tests
        run: node --test src/features/email/__tests__/compose-mode.test.mjs src/features/email/__tests__/translate-email.test.mjs src/features/email/__tests__/email-body-format.test.mjs src/features/email/invoice-list.test.ts src/features/email/email-inbox-page.test.ts src/native/list-sync/planner.test.ts src/native/list-sync/id-align.test.ts src/native/list-sync/page.test.ts

      - name: Run master-password biometric unlock tests
        run: node --test src/features/auth/__tests__/unlock-auth.test.mjs src/native/__tests__/biometric-errors.test.ts

      - name: Run backend connection settings tests
        run: node --test src/config/api-base.test.ts src/config/selected-instance.test.ts

      - name: Run meeting studio helper tests
        run: node --test src/features/meetings/meeting-list.test.ts src/features/meetings/meeting-meta.test.ts src/features/meetings/meeting-skills.test.ts src/features/meetings/meeting-todos.test.ts src/features/meetings/meeting-related.test.ts src/features/meetings/meeting-utterance.test.ts src/features/meetings/meeting-live-caption.test.ts

      - name: Run scheduled-task create UX helper tests
        run: node --test src/features/scheduled-tasks/schedule-plan.test.ts src/features/scheduled-tasks/task-prompt.test.ts

      - name: Run user-config LWW planner tests
        run: node --test src/native/config-sync/planner.test.ts

      - name: Run notes/meetings/permission helper tests
        run: node --test src/features/notes/*.test.ts src/features/meetings/topic-change.test.ts src/features/meetings/gateway-kind.test.ts src/composables/permission-action.test.ts src/native/audio-inputs.test.ts src/native/detect-lang.test.ts src/api/stt-cloud.test.ts

      - name: Run email account/cleanup helper tests
        run: node --test src/features/email/__tests__/account-mirror-write.test.mjs src/features/email/__tests__/account-sync.test.mjs src/features/email/__tests__/cleanup-filter.test.mjs src/features/email/__tests__/providers.test.mjs

      # BUG-U/V：这两个文件的存在本身就是回归锁 ——
      # BUG-U 是调用点 import 了一个从未创建的模块，BUG-V 是 WS 地址没有判据。
      - name: Run API error / WebSocket URL contract tests
        run: node --test src/composables/api-error-message.test.ts src/api/websocket-url.test.ts

      # Evernote 导入解析是 fast-xml-parser 全仓唯一使用点；4→5 升级的行为契约锁在这批用例里。
      - name: Run Evernote ENEX parser tests
        run: node --test src/features/imports/evernote-parser.test.ts

      # ── 孤儿测试卡口（2026-10-02 接进 CI）──────────────────────────────
      # 为什么必须进 CI：这张卡口本机在 npm run gates 里执行，而 CI 从来**不跑 gates**
      # （它逐条手列 node --test）。只接本机的话，"新增测试没人跑"在 CI 上照样静默通过
      # —— 护栏存在但没人执行，等于没有护栏，正是这批测试当初的成因。
      #
      # 两步的分工：
      #   check:test-coverage  静态：任一 *.test.mjs / *.test.ts 没被 gates 可达脚本覆盖即失败
      #   test:all             运行时：全量 145 个文件，并核对"枚举 ⊆ 实际执行且都有产出"
      # 上面那些手列步骤**不要删**：它们各自带注释说明锁的是哪个历史缺陷，保留可追溯性。
      - name: Check every test file is covered by a gates-reachable script
        run: npm run check:test-coverage

      - name: Run ALL .test.mjs / .test.ts with execution census
        run: npm run test:all

      # ── 跨行 needle 的 CRLF 护栏（2026-10-02 接进 CI）──────────────────
      # 为什么这张卡口在 Linux 上也有意义（而不是"Windows 才需要"）：
      # 本护栏不只看"本机有没有炸"，它断言的是**needle 真的还能命中**。
      # 事故形态是：needle 依赖 LF 文本、而 Windows 检出是 CRLF →
      # 判据静默失效。Linux 上永远是 LF，所以 Linux 跑不出这个 bug；
      # 但只要有人把归一化删掉、或新增一个没归一化的跨行 needle，
      # 这张卡口在 Linux 上就会因为"两边都匹配不上/没归一化"而报警，
      # 从而在合并前拦住，而不是等某个 Windows 开发者本地踩。
      # 反过来：它对**已正确归一化**的代码保持沉默（实测 NEG-1b）。
      - name: Guard against EOL-fragile multi-line needles
        run: npm run check:crlf-needles

      - name: Build HarmonyOS ArkWeb assets
        run: MOBILE_FAST=1 VITE_API_BASE=https://harmony-ci.example.invalid node scripts/build-harmony.mjs dev

  android-assemble:
    name: android assembleDebug (frontend/android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on docs-only PRs to keep CI fast.
    if: "!contains(github.event.head_commit.message, 'docs(opt-v4)')"

    defaults:
      run:
        working-directory: frontend/android

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web assets
        # cap sync 会把 webDir(dist) 拷进 android 工程；dist 被 gitignore，
        # CI 必须先构建，否则 "Could not find the web assets directory: ./dist"。
        # 统一走 build-mobile.mjs 以强制经过 VITE_API_BASE 空值守卫
        # （2026-09-05 真机事故：空 base 的 APK 所有 /api 请求拿到 index.html）。
        # CI 无真实后端可指向，故显式 opt-out——此 APK 仅做构建完整性验证。
        run: MOBILE_FAST=1 MOBILE_ALLOW_EMPTY_API_BASE=1 node scripts/build-mobile.mjs android prod
        working-directory: frontend

      - name: Sync Capacitor (frontend/android only)
        # ADR-009: frontend/android is the single Android source of
        # truth. We never run `npx cap sync` against the root android/
        # directory. build-mobile.mjs 内部已 sync 一次，此处幂等重跑。
        run: npx cap sync android
        working-directory: frontend

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        # Caches gradle wrapper + dependencies across runs.
        run: ./gradlew --no-daemon assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload APK on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-assemble-failure
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
