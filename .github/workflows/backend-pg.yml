name: backend-pg

on:
  push:
    branches: [main, feat/**]
    paths:
      - "backend/**"
      - ".github/workflows/backend-pg.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-pg.yml"

permissions:
  contents: read

env:
  # ★ 业务时区基准：CI 必须与**生产部署**同时区（Asia/Shanghai）。
  #
  #   仓里有**故意**对进程时区敏感的判据（§393.7 的「写-读往返」门：
  #   它的负控前提是「设备当地那天 ≠ UTC 那天」⇒ 在 TZ=UTC 下会**按设计**报红，
  #   报「时区基准没对齐」，而不是悄悄让那几条退化成恒真断言）。
  #   ⇒ CI 跑在 UTC ⇒ 哨兵每次都开火 ⇒ main 上每个 commit 都是红的。
  #
  #   而业务口径本来就全是 Asia/Shanghai（前端 `REMINDER_TZ`、
  #   `schedule-plan.DEFAULT_TZ`、后端发票日期口径）⇒ CI 与生产同口径，
  #   才测得到真问题（§963 实测：TZ=UTC 下 CI 红 3 个前端测试文件 + 1 个后端包）。
  TZ: Asia/Shanghai

jobs:
  test-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pocket_test
          POSTGRES_PASSWORD: pocket_test
          POSTGRES_DB: pocket_test
        options: >-
          --health-cmd "pg_isready -U pocket_test -d pocket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      CI: "true"
      POCKET_TEST_POSTGRES_DSN: postgres://pocket_test:pocket_test@127.0.0.1:5432/pocket_test?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run PostgreSQL integration tests
        run: make test-pg
