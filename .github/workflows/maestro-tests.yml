# GitHub Actions Workflow for Maestro Tests
name: Maestro Mobile Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 每日零点自动运行

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 冒烟测试 - PR 必须通过
  # ═══════════════════════════════════════════════════════════════════
  smoke-test:
    name: Smoke Tests
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      
      - name: Build Backend
        run: |
          cd backend
          go build -o pocketd ./cmd/pocketd
      
      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android
      
      - name: Build APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug
      
      - name: Setup Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: echo "Emulator started"
      
      - name: Start Backend Service
        run: |
          cd backend
          export POCKET_JWT_SECRET="${{ secrets.POCKET_JWT_SECRET }}"
          export POCKET_HTTP_PORT=8088
          ./pocketd &
          sleep 5
      
      - name: Run Smoke Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          POCKET_MASTER: ${{ secrets.POCKET_MASTER }}
          POCKET_DEV_PASS: ${{ secrets.POCKET_DEV_PASS }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            adb install -r frontend/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:18099 tcp:8088
            ./scripts/run-maestro-suite.sh smoke
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-reports
          path: |
            test-reports/
            logs/maestro/
          retention-days: 30
      
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-reports/*.xml
          check_name: Smoke Test Results

  # ═══════════════════════════════════════════════════════════════════
  # 回归测试 - PR 到 main 分支时运行
  # ═══════════════════════════════════════════════════════════════════
  regression-test:
    name: Regression Tests
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: smoke-test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      
      - name: Build Backend
        run: |
          cd backend
          go build -o pocketd ./cmd/pocketd
      
      - name: Build APK
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      
      - name: Start Backend Service
        run: |
          cd backend
          export POCKET_JWT_SECRET="${{ secrets.POCKET_JWT_SECRET }}"
          export POCKET_HTTP_PORT=8088
          ./pocketd &
          sleep 5
      
      - name: Run Regression Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          POCKET_MASTER: ${{ secrets.POCKET_MASTER }}
          POCKET_DEV_PASS: ${{ secrets.POCKET_DEV_PASS }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            adb install -r frontend/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:18099 tcp:8088
            ./scripts/run-maestro-suite.sh regression
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: regression-test-reports
          path: |
            test-reports/
            logs/maestro/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════
  # 完整测试 - 发布前和每日自动运行
  # ═══════════════════════════════════════════════════════════════════
  master-test:
    name: Master Tests
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: smoke-test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      
      - name: Build Backend
        run: |
          cd backend
          go build -o pocketd ./cmd/pocketd
      
      - name: Build APK
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      
      - name: Start Backend Service
        run: |
          cd backend
          export POCKET_JWT_SECRET="${{ secrets.POCKET_JWT_SECRET }}"
          export POCKET_HTTP_PORT=8088
          ./pocketd &
          sleep 5
      
      - name: Run Master Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          POCKET_MASTER: ${{ secrets.POCKET_MASTER }}
          POCKET_DEV_PASS: ${{ secrets.POCKET_DEV_PASS }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            adb install -r frontend/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:18099 tcp:8088
            ./scripts/run-maestro-suite.sh master
      
      - name: Run Performance Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            ./scripts/run-performance-test.sh
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: master-test-reports
          path: |
            test-reports/
            logs/maestro/
          retention-days: 90
      
      - name: Generate HTML Report
        if: always()
        run: ./scripts/generate-maestro-report.sh
      
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: html-report
          path: test-reports/*.html
          retention-days: 90
      
      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'test-reports/test-summary-*.txt';
            const report = fs.readFileSync(reportPath, 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Maestro 测试报告\n\n\`\`\`\n${report}\n\`\`\``
            });

  # ═══════════════════════════════════════════════════════════════════
  # 测试结果通知
  # ═══════════════════════════════════════════════════════════════════
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [smoke-test, regression-test, master-test]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
    
    steps:
      - name: Send Notification
        run: |
          echo "Test completed. Results available in artifacts."
          # 这里可以添加 Slack/Email/钉钉等通知
