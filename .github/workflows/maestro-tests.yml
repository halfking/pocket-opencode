# GitHub Actions Workflow for Maestro Tests
#
# ⚠️ 2026-11-27 结构性修复（首次真实运行验证的产物，逐条对应 CI 日志证据）：
#   1. Build Backend 报 `go: command not found`（exit 127）→ 补 actions/setup-go@v5。
#   2. EnricoMi/publish-unit-test-result-action@v2 是**容器 action**，
#      macOS runner 上直接报 `Container action is only supported on Linux`
#      → 整步删除（JUnit XML 已随 artifacts 上传，发布步骤等链路绿了再挑 macOS 兼容的实现）。
#   3. 登录链路：CI 后端无 Casdoor/RedClaw → /api/auth/sso/status 404
#      ⇒ 登录页恒为「标签页密码表单」（LoginView v-else 分支），
#      走后端 dev 旁路（POCKET_DEV_AUTH + POCKET_AUTH_PASS；用户名固定
#      admin —— POCKET_AUTH_USER 缺省回退 admin，两端天然一致）签发 token。
#      对应的 Maestro flow 是 .maestro/ci-smoke.yaml（自带登录段）；
#      真机 Casdoor 直连流程（_login.yaml）不动。
#   4. API base：APK 内没有同源后端，必须构建期烘 VITE_API_BASE。
#      10.0.2.2 是模拟器访问宿主机 loopback 的专用别名，
#      pocketd 绑 ":$PORT"（全接口），无需 adb reverse。
#   5. 模拟器跑在 ubuntu-latest + KVM：GH 托管 macOS runner 全系为 VM 且
#      M1 宿主不支持嵌套虚拟化 → emulator HVF 必崩（4 个 run 四种组合实证，
#      见 actions/runner-images#9472）；ubuntu runner 原生嵌套 KVM 可用。
#      API 34 + x86_64（KVM x86 主流配方）；本地预验证用 pocket_test AVD
#      API 34 arm64（本机 M 系列）完成端到端全绿。
#   6. 原来的 smoke 有**两个连续** emulator-runner（第一个只 echo），
#      每次都会完整起一台模拟器 → 合并成一个，backend 起在 runner script 里。
name: Maestro Mobile Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # 每日零点自动运行

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 冒烟测试 - PR 必须通过
  #
  # CI 专用合成凭据：一次性模拟器 + 一次性 SQLite，非真实凭据。
  # 仓库当前未配置 secrets，这里的字面量是兜底值；日后若在仓库 secrets
  # 配置同名值则优先生效。secret-scan-ok 合成值，与 start-acc-test.sh
  # 的本地合成口令同纪律（后端 secrets_test 的 credential-assignment
  # 规则要求 ≥24 字符且带引号赋值，这些 13~15 字符合成值不命中，也不该命中）。
  # ═══════════════════════════════════════════════════════════════════
  smoke-test:
    name: Smoke Tests
    # ⚠️ GitHub 托管 macOS runner 全系 arm64 且是 VM（actions/runner-images#9472：
    #    M1 宿主不支持嵌套虚拟化 → Android emulator HVF 中途 HV_UNSUPPORTED 崩，
    #    run 46028049508/46031979263 API 30/34 双崩实证；macos-15 label 也已落
    #    arm64，run 46045634257 的 x86_64 镜像直接 FATAL CPU 不匹配）。
    #    M3+macOS15 嵌套虚拟化尚未覆盖 GH runner 池。⇒ 模拟器面改走 ubuntu-latest：
    #    GitHub Linux runner 2023 起原生支持嵌套 KVM，reactivecircus action 在
    #    linux 上自动启用硬件加速（disable-linux-hw-accel: false）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POCKET_DEV_PASS: ${{ secrets.POCKET_DEV_PASS != '' && secrets.POCKET_DEV_PASS || 'ci-dev-pass-2026' }}
      POCKET_MASTER: ${{ secrets.POCKET_MASTER != '' && secrets.POCKET_MASTER || 'ci-master-2026' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # /dev/kvm 在 GH ubuntu runner 上存在但默认权限不给 runner 用户
      # （run 46054885131: ProbeKVM permission denied）。reactivecircus README
      # 的标准解法：udev 规则放行 kvm 节点。
      - name: Grant KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build Backend
        run: |
          cd backend
          go build -o pocketd ./cmd/pocketd

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          # 构建期烘入模拟器→宿主机的 API base（见文件头注 4）。
          # CAP_ANDROID_SCHEME=http：BUG-F 守卫拦「明文 http base + https 壳」
          # （ws:// 被 Chromium>=111 硬阻断）；10.0.2.2 是明文 http，壳必须换 http。
          CAP_ANDROID_SCHEME=http VITE_API_BASE=http://10.0.2.2:18099 npm run build
          CAP_ANDROID_SCHEME=http npx cap sync android

      - name: Build APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      # 模拟器内的全部动作合并在一个 runner script 里（见文件头注 6）：
      # 装包 → 起后端（dev 旁路）→ 健康检查 → 跑 ci 套件。
      - name: Run Smoke Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # GitHub ubuntu runner 是嵌套 KVM VM；action 的 auto 档误判并关掉
          # 加速 → '-accel off' 被 qemu 拒绝（Software CPU emulation is not
          # supported，run 46052199071）。显式 false 启用 KVM。
          disable-linux-hw-accel: false
          profile: Nexus 6
          script: |
            adb install -r $GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            export POCKET_DEV_AUTH=true
            export POCKET_AUTH_PASS="$POCKET_DEV_PASS"
            # jwt secret ≥32 bytes（config.go 硬校验；固定合成值仅 CI 本地库用）
            export POCKET_JWT_SECRET="ci-jwt-secret-2026-openpocket-mobile-smoke"
            export POCKET_HTTP_PORT=18099
            export POCKET_DB_PATH=$GITHUB_WORKSPACE/backend/data/pocket-ci.sqlite
            # ⚠️ reactivecircus action 在 linux 用 /usr/bin/sh(dash) **逐行** sh -c
            #    执行 script（run 46057575276/46059264737 两次实证）：
            #    多行块被截断、cd 不跨行 —— 所以每一行都必须自含绝对路径，
            #    不依赖前一行 cd，不用循环/花括号组。
            $GITHUB_WORKSPACE/backend/pocketd > $GITHUB_WORKSPACE/backend/pocketd-ci.log 2>&1 &
            sleep 8
            curl -sf http://127.0.0.1:18099/healthz >/dev/null || tail -100 $GITHUB_WORKSPACE/backend/pocketd-ci.log
            curl -sf http://127.0.0.1:18099/healthz >/dev/null
            $GITHUB_WORKSPACE/scripts/run-maestro-suite.sh ci

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            test-reports/
            logs/maestro/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════
  # 回归测试 - PR 到 main 分支时运行
  #
  # ⚠️ 暂跑 ci 套件：regression 套件（notes/tasks/email/flashcards-crud）
  #    仍依赖 _login.yaml 的 Casdoor 直连分支（真机专用，CI 无 Casdoor）。
  #    等 _login.yaml 落地「标签页/Casdoor 双模式登录」后再切回
  #    run-maestro-suite.sh regression。当前先让 PR 门禁有一条绿色基线。
  # ═══════════════════════════════════════════════════════════════════
  regression-test:
    name: Regression Tests
    # macos-26-arm64 (即 macos-latest) 的 HVF 使 qemu 中途 HV_UNSUPPORTED 崩溃
    # (runs 46028049508/46031979263 实证 API 30/34 双崩于 boot 中段)。
    # 钉 macos-15-arm64 后 run 46035390974 免费额度排队 >1h —— arm64 runner
    # 池在免费 plan 长期饱和。改走 Intel (macos-15) + x86_64 API 34：
    # 架构原生匹配无需 Rosetta（原 workflow 的 x86_64 旧配置本身没毛病，
    # 毛病出在 macos-26 镜像），Intel runner 供给更充足。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: smoke-test
    env:
      POCKET_DEV_PASS: ${{ secrets.POCKET_DEV_PASS != '' && secrets.POCKET_DEV_PASS || 'ci-dev-pass-2026' }}
      POCKET_MASTER: ${{ secrets.POCKET_MASTER != '' && secrets.POCKET_MASTER || 'ci-master-2026' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # /dev/kvm 在 GH ubuntu runner 上存在但默认权限不给 runner 用户
      # （run 46054885131: ProbeKVM permission denied）。reactivecircus README
      # 的标准解法：udev 规则放行 kvm 节点。
      - name: Grant KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build Backend
        run: |
          cd backend
          go build -o pocketd ./cmd/pocketd

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          CAP_ANDROID_SCHEME=http VITE_API_BASE=http://10.0.2.2:18099 npm run build
          CAP_ANDROID_SCHEME=http npx cap sync android

      - name: Build APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Run Regression Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # GitHub ubuntu runner 是嵌套 KVM VM；action 的 auto 档误判并关掉
          # 加速 → '-accel off' 被 qemu 拒绝（Software CPU emulation is not
          # supported，run 46052199071）。显式 false 启用 KVM。
          disable-linux-hw-accel: false
          profile: Nexus 6
          script: |
            adb install -r $GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            export POCKET_DEV_AUTH=true
            export POCKET_AUTH_PASS="$POCKET_DEV_PASS"
            # jwt secret ≥32 bytes（config.go 硬校验；固定合成值仅 CI 本地库用）
            export POCKET_JWT_SECRET="ci-jwt-secret-2026-openpocket-mobile-smoke"
            export POCKET_HTTP_PORT=18099
            export POCKET_DB_PATH=$GITHUB_WORKSPACE/backend/data/pocket-ci.sqlite
            # ⚠️ reactivecircus action 在 linux 用 /usr/bin/sh(dash) **逐行** sh -c
            #    执行 script（run 46057575276/46059264737 两次实证）：
            #    多行块被截断、cd 不跨行 —— 所以每一行都必须自含绝对路径，
            #    不依赖前一行 cd，不用循环/花括号组。
            $GITHUB_WORKSPACE/backend/pocketd > $GITHUB_WORKSPACE/backend/pocketd-ci.log 2>&1 &
            sleep 8
            curl -sf http://127.0.0.1:18099/healthz >/dev/null || tail -100 $GITHUB_WORKSPACE/backend/pocketd-ci.log
            curl -sf http://127.0.0.1:18099/healthz >/dev/null
            $GITHUB_WORKSPACE/scripts/run-maestro-suite.sh ci

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-reports
          path: |
            test-reports/
            logs/maestro/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════
  # 完整测试 - 仅手动触发
  #
  # ⚠️ 从 push/schedule 改为 workflow_dispatch-only（2026-11-27）：
  #    master-test-suite.yaml 在本地真机/模拟器上最后一次运行也是红的
  #    （test-reports/master-complete-20261126-181234.xml：
  #     "打开菜单|创建主密码" 断言失败），且依赖 Casdoor 直连登录。
  #    让它挂在每次 push 上只会每天烧 60min macOS 时长换一个已知红。
  #    等 master 套件修绿 + 双模式登录落地后，把 if 改回
  #    push/schedule/dispatch 并把套件切回 master。
  # ═══════════════════════════════════════════════════════════════════
  master-test:
    name: Master Tests
    # macos-26-arm64 (即 macos-latest) 的 HVF 使 qemu 中途 HV_UNSUPPORTED 崩溃
    # (runs 46028049508/46031979263 实证 API 30/34 双崩于 boot 中段)。
    # 钉 macos-15-arm64 后 run 46035390974 免费额度排队 >1h —— arm64 runner
    # 池在免费 plan 长期饱和。改走 Intel (macos-15) + x86_64 API 34：
    # 架构原生匹配无需 Rosetta（原 workflow 的 x86_64 旧配置本身没毛病，
    # 毛病出在 macos-26 镜像），Intel runner 供给更充足。
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    needs: smoke-test
    env:
      POCKET_DEV_PASS: ${{ secrets.POCKET_DEV_PASS != '' && secrets.POCKET_DEV_PASS || 'ci-dev-pass-2026' }}
      POCKET_MASTER: ${{ secrets.POCKET_MASTER != '' && secrets.POCKET_MASTER || 'ci-master-2026' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # /dev/kvm 在 GH ubuntu runner 上存在但默认权限不给 runner 用户
      # （run 46054885131: ProbeKVM permission denied）。reactivecircus README
      # 的标准解法：udev 规则放行 kvm 节点。
      - name: Grant KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build Backend
        run: |
          cd backend
          go build -o pocketd ./cmd/pocketd

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          CAP_ANDROID_SCHEME=http VITE_API_BASE=http://10.0.2.2:18099 npm run build
          CAP_ANDROID_SCHEME=http npx cap sync android

      - name: Build APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug

      - name: Run Master Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # GitHub ubuntu runner 是嵌套 KVM VM；action 的 auto 档误判并关掉
          # 加速 → '-accel off' 被 qemu 拒绝（Software CPU emulation is not
          # supported，run 46052199071）。显式 false 启用 KVM。
          disable-linux-hw-accel: false
          profile: Nexus 6
          script: |
            adb install -r $GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/debug/app-debug.apk
            export POCKET_DEV_AUTH=true
            export POCKET_AUTH_PASS="$POCKET_DEV_PASS"
            # jwt secret ≥32 bytes（config.go 硬校验；固定合成值仅 CI 本地库用）
            export POCKET_JWT_SECRET="ci-jwt-secret-2026-openpocket-mobile-smoke"
            export POCKET_HTTP_PORT=18099
            export POCKET_DB_PATH=$GITHUB_WORKSPACE/backend/data/pocket-ci.sqlite
            # ⚠️ reactivecircus action 在 linux 用 /usr/bin/sh(dash) **逐行** sh -c
            #    执行 script（run 46057575276/46059264737 两次实证）：
            #    多行块被截断、cd 不跨行 —— 所以每一行都必须自含绝对路径，
            #    不依赖前一行 cd，不用循环/花括号组。
            $GITHUB_WORKSPACE/backend/pocketd > $GITHUB_WORKSPACE/backend/pocketd-ci.log 2>&1 &
            sleep 8
            curl -sf http://127.0.0.1:18099/healthz >/dev/null || tail -100 $GITHUB_WORKSPACE/backend/pocketd-ci.log
            curl -sf http://127.0.0.1:18099/healthz >/dev/null
            $GITHUB_WORKSPACE/scripts/run-maestro-suite.sh ci

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-test-reports
          path: |
            test-reports/
            logs/maestro/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════
  # 测试结果通知
  # ═══════════════════════════════════════════════════════════════════
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [smoke-test, regression-test, master-test]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Send Notification
        run: |
          echo "Test completed. Results available in artifacts."
          # 这里可以添加 Slack/Email/钉钉等通知
