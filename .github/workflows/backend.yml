name: backend

on:
  push:
    branches: [main, feat/**]
  pull_request:
    paths:
      - "backend/**"
      # 本 job 也用 node 跑 scripts/check-smart-quotes.mjs。改它自己却不触发本
      # workflow ⇒ 那道门在这样的 PR 上一次都不跑，而 gates.json 里没有它、
      # frontend.yml 的 gates 也不含它 ⇒ 两头都不接管（设计文档 §149.3 / §172）。
      #
      # ★ 只列这一个文件，**不是** "scripts/**"：scripts/ 下有 493 个文件，而本
      #   workflow 的两个 job timeout 合计 25 分钟（go build + go test -race 带
      #   postgres），frontend.yml 已覆盖 scripts/** ⇒ 用通配会给 493 个文件各加
      #   一次完整后端流水线，而它真正执行的 scripts 文件只有这一个。
      #   ⇒ 本 workflow 的 paths 应当镜像「它真正执行的东西」。
      # ★ 往本 workflow 加新 node 门时，同步在这里加它的路径 —— 这就是漏的那一步。
      - "scripts/check-smart-quotes.mjs"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  # 编译卡口：只做 `go build ./...`，无 Postgres / npm / 前端依赖。
  # 存在的理由：后端曾有一批改动从未编译过就合入 main，因为 CI 里
  # `go build` 排在 `go test -race ./...` 之后，编译错误要等 15 分钟
  # 的测试跑（甚至等 Postgres 起来）才暴露，且看不出"编译不过"这个结论。
  # 这个 job 把它变成独立的、几分钟内失败的硬卡口。
  build-gate:
    name: build gate (go build ./...)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 明确不允许被降级为非阻塞。
    continue-on-error: false

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Build backend (blocking gate)
        run: go build ./...

      # 2026-10-04 新增。挡的是一类**注释与代码语义不一致**的损坏：
      # SQL 的空串字面量 `''` 被写成 `”`（U+201D）。7 处存量在 round39 修掉，
      # 这道门禁挡复发。
      #
      # 放在 build-gate 而不是 test job：它只需要 node、不需要 Go toolchain
      # 与 postgres service，失败得越早越好。
      # 自证用 --selftest（敏感度/特异度/变盲 19 条），不另开一条流水线。
      - name: Smart-quote gate
        run: |
          node scripts/check-smart-quotes.mjs --selftest
          node scripts/check-smart-quotes.mjs

  test:
    # 编译不过时不必再等测试，build-gate 先失败。
    needs: build-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pocket_test
          POSTGRES_PASSWORD: pocket_test
          POSTGRES_DB: pocket_test
        options: >-
          --health-cmd "pg_isready -U pocket_test -d pocket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      CI: "true"
      POCKET_TEST_POSTGRES_DSN: postgres://pocket_test:pocket_test@127.0.0.1:5432/pocket_test?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test -race ./... -count=1

      - name: Run vet
        run: go vet ./...

      - name: Build backend
        run: go build ./...
