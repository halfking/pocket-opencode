name: backend

on:
  push:
    branches: [main, feat/**]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pocket_test
          POSTGRES_PASSWORD: pocket_test
          POSTGRES_DB: pocket_test
        options: >-
          --health-cmd "pg_isready -U pocket_test -d pocket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      CI: "true"
      POCKET_TEST_POSTGRES_DSN: postgres://pocket_test:pocket_test@127.0.0.1:5432/pocket_test?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test -race ./... -count=1

      - name: Run vet
        run: go vet ./...

      - name: Build backend
        run: go build ./...
