# pocket.kxpms.cn — 9443 PROXY-protocol vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线）
# 2026-09-14 改造：upstream 定义内联自包含（原先跨文件引用 pocket.itestu.cn.conf 的
# pocket_mac_api/pocket_mac_web，会导致 itestu 改 mesh 时误伤 kxpms 域）。
# 252 直出：kxpms 公网域前后端都在 252 本机容器（172.16.2.210:8090 / 127.0.0.1:4175）。
# 证书：kxpms-aiworkos-edge lineage（SAN 含 pocket.kxpms.cn + redclaw.kxpms.cn）。
upstream pocket_kxpms_api {
    server 172.16.2.210:8090;
    keepalive 8;
}

upstream pocket_kxpms_web {
    server 127.0.0.1:4175;
    keepalive 4;
}

server {
    listen 9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name pocket.kxpms.cn;

    ssl_certificate /etc/letsencrypt/live/kxpms-aiworkos-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kxpms-aiworkos-edge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    location = /healthz {
        proxy_pass http://pocket_kxpms_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /plugin/ws {
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://pocket_kxpms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
