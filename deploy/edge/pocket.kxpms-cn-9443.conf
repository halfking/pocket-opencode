# pocket.kxpms.cn — 9443 PROXY-protocol vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线）
# 2026-09-14 改造：upstream 定义内联自包含（原先跨文件引用 pocket.itestu.cn.conf 的
# pocket_mac_api/pocket_mac_web，会导致 itestu 改 mesh 时误伤 kxpms 域）。
# 252 直出：kxpms 公网域前后端都在 252 本机容器（172.16.2.210:8090 / 127.0.0.1:4175）。
# 证书：kxpms-aiworkos-edge lineage（SAN 含 pocket.kxpms.cn + redclaw.kxpms.cn）。
upstream pocket_kxpms_api {
    server 172.16.2.210:8090;
    keepalive 8;
}

upstream pocket_kxpms_web {
    server 127.0.0.1:4175;
    keepalive 4;
}

server {
    listen 9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name pocket.kxpms.cn;

    ssl_certificate /etc/letsencrypt/live/kxpms-aiworkos-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kxpms-aiworkos-edge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    location = /healthz {
        proxy_pass http://pocket_kxpms_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /plugin/ws {
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 事件回调（飞书 / 企业微信）2026-10-03 补，与 pocket.itestu.cn.conf 同因：
    # 没有 /callback/ 规则时请求落进下面的 `location /`，被当 SPA 返回 index.html，
    # 飞书/企业微信永远收不到约定的应答。本 vhost 的 `location /` 是
    # pocket_kxpms_web（SPA），所以必须显式转给 pocket_kxpms_api。
    # 鉴权由应用内签名校验负责，后端 server.go:682/689 也没套 requireAuth。
    location /callback/ {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 资源委托 / 工作区授权面（2026-11-03 补）。
    #
    # 为什么必须单独写：这两族路由是**后端注册了、边缘没跟上**的 ——
    #   server.go:736 /internal/resource-authority/workspaces/
    #   server.go:754 /internal/workspace-authority/workspaces
    #   server.go:755 /internal/workspace-authority/workspaces/
    # 而本 vhost 的 `location /` 是前端兜底 ⇒ 请求落进去会被当成 SPA
    # 返回 index.html ⇒ 资源委托签发拿到的不是 JSON 而是一段 HTML。
    #
    # 鉴权不在边缘：这两族路由自带 Bearer 服务委托校验（应用内验签），
    # 边缘只负责把请求送到后端 —— 与 /callback/ 同一分工。
    location /internal/ {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://pocket_kxpms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
