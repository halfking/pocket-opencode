# openpocket-api.kxpms.cn vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线；2026-09-14 新建）
# 252 直出：kxpms 公网域的 pocketd 就在 252 本机（opencode-pocket-pocketd-server-opp）。
# SNI：stream sni-proxy 无此域名条目，走 default → 127.0.0.1:9443 兜底，无需改 stream 配置。
# 证书：/etc/letsencrypt/live/openpocket-api.kxpms.cn/（apply 前须先 certbot certonly 签出，否则 nginx -t 失败）
# 回滚：mv 本文件为 .disabled + nginx -t + reload

upstream openpocket_api_kxpms_upstream {
    server 172.16.2.210:8090;
    keepalive 16;
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;

    listen 9443 ssl http2 proxy_protocol;
    listen [::]:9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name openpocket-api.kxpms.cn;

    ssl_certificate     /etc/letsencrypt/live/openpocket-api.kxpms.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpocket-api.kxpms.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_API_openpocket-api.kxpms.cn:10m;
    ssl_session_timeout 10m;

    client_max_body_size 256M;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        proxy_pass http://openpocket_api_kxpms_upstream/healthz;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://openpocket_api_kxpms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 命令回路必需：禁缓冲 + 长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
