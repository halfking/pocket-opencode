# openpocket.kxpms.cn vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线；2026-09-15 新建）
# 语义（用户 2026-09-15 拍板）：纯 API vhost，仿 openpocket-api.kxpms.cn.conf——
#   全部流量直出 252 本机 pocketd（opencode-pocket-pocketd-server-opp）172.16.2.210:8090，
#   含 /healthz 探活。无 mesh 兜底、无 web UI 代理——web UI 入口由 openpocket-web.kxpms.cn 承担。
#   根路径 / 由 pocketd 决定（404 为预期，同 openpocket-api.kxpms.cn）。
# SNI：stream sni-proxy 无此域名条目，走 default → 127.0.0.1:9443 兜底，无需改 stream 配置。
# 证书：/etc/letsencrypt/live/openpocket.kxpms.cn/（apply 前须先 certbot certonly 签出，否则 nginx -t 失败）
# 回滚：mv 本文件为 .disabled + nginx -t + reload（证书 lineage 保留）

upstream openpocket_kxpms_upstream {
    # 252 本机 pocketd（opencode-pocket-pocketd-server-opp），直出不走 mesh。
    server 172.16.2.210:8090;
    keepalive 16;
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;

    listen 9443 ssl http2 proxy_protocol;
    listen [::]:9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name openpocket.kxpms.cn;

    ssl_certificate     /etc/letsencrypt/live/openpocket.kxpms.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpocket.kxpms.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_openpocket.kxpms.cn:10m;
    ssl_session_timeout 10m;

    client_max_body_size 256M;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_kxpms_upstream/healthz;
        proxy_set_header Host $host;
    }
    location / {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_kxpms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 命令回路必需：禁缓冲 + 长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
