# HTTP-01 ACME + HTTPS redirect for openpocket-web.kxpms.cn (2026-09-15)
# 纯 web UI 域（仿 pocket.itestu.cn 同模式但不带 itestu 共享证书）。
server {
    listen 80;
    listen [::]:80;
    server_name openpocket-web.kxpms.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
