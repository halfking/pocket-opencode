# HTTP-01 ACME + HTTPS redirect for openpocket-api.kxpms.cn (2026-09-14 新建，2026-09-15 收编入库)
# 252 直出 API 域的 ACME 配套；与 openpocket-api.kxpms.cn.conf（9443 vhost）成对。
server {
    listen 80;
    listen [::]:80;
    server_name openpocket-api.kxpms.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
