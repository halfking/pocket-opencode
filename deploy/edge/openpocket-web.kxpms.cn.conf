# openpocket-web.kxpms.cn vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线；2026-09-15 新建）
# 纯 web UI 域：仿 pocket.itestu.cn 的 pocket_mac_web 模式——Mac nb-mac-01 mesh 主（前端 4175），
# 252 本机前端兜底；API / ws 同样 Mac mesh 主 + 252 兜底。
# SNI：stream sni-proxy 无此域名条目，走 default → 127.0.0.1:9443 兜底，无需改 stream 配置。
# 证书：/etc/letsencrypt/live/openpocket-web.kxpms.cn/（apply 前须先 certbot certonly 签出，否则 nginx -t 失败）
# 回滚：mv 本文件为 .disabled + nginx -t + reload（证书 lineage 保留）

upstream openpocket_web_kxpms_api {
    # NetBird mesh 到 Mac nb-mac-01（主），252 本机 pocketd 兜底。
    server __MAC_MESH_IP__:8090 max_fails=3 fail_timeout=15s;
    server 172.16.2.210:8090 backup;
    keepalive 8;
}

upstream openpocket_web_kxpms_web {
    # NetBird mesh 到 Mac frontend :4175（主），252 本机 frontend 兜底。
    server __MAC_MESH_IP__:4175 max_fails=3 fail_timeout=15s;
    server 172.16.2.210:4175 backup;
    keepalive 4;
}

server {
    listen 9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name openpocket-web.kxpms.cn;

    ssl_certificate     /etc/letsencrypt/live/openpocket-web.kxpms.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpocket-web.kxpms.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_openpocket-web.kxpms.cn:10m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;
    # mesh 主上游不可达时快速切换兜底（默认 60s 会造成周期性卡顿）
    proxy_connect_timeout 3s;

    location = /healthz {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_web_kxpms_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_web_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_web_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /plugin/ws {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_web_kxpms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_web_kxpms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
