# openpocket-api.itestu.cn vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线）
# 2026-09-13 可演示平台方案 C2 收编入库；2026-09-14 改为 mesh 主上游 + 252 兜底。
# upstream 主：NetBird mesh 到 Mac nb-mac-01 __MAC_MESH_IP__:8090（本地 pocketd）
# upstream 兜底：172.16.2.210:8090 = opencode-pocket-pocketd-server-opp
# 回滚：mv 本文件为 .disabled + nginx -t + reload（证书 lineage /etc/letsencrypt/live/openpocket-api.itestu.cn/ 保留）

upstream openpocket_api_upstream {
    server __MAC_MESH_IP__:8090 max_fails=3 fail_timeout=15s;
    server 172.16.2.210:8090 backup;
    keepalive 16;
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;

    listen 9443 ssl http2 proxy_protocol;
    listen [::]:9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name openpocket-api.itestu.cn;

    ssl_certificate     /etc/letsencrypt/live/openpocket-api.itestu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openpocket-api.itestu.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_API_openpocket-api.itestu.cn:10m;
    ssl_session_timeout 10m;

    client_max_body_size 256M;
    # mesh 主上游不可达时快速切换兜底（默认 60s 会造成周期性卡顿）
    proxy_connect_timeout 3s;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_api_upstream/healthz;
        proxy_set_header Host $host;
    }
    location / {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://openpocket_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 命令回路必需：禁缓冲 + 长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
