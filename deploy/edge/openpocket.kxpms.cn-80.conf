# HTTP-01 ACME + HTTPS redirect for openpocket.kxpms.cn (2026-09-15)
# 主入口域（apex）：纯 API 直出 172.16.2.210:8090 + /healthz 探活（web UI 入口在 openpocket-web.kxpms.cn）。
server {
    listen 80;
    listen [::]:80;
    server_name openpocket.kxpms.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
