# pocket.itestu.cn — 9443 PROXY-protocol vhost（仓内 SSOT 模板，经 apply-edge-conf.sh 渲染上线）
# 拓扑：公网 443(stream SNI default) → 9443 → NetBird mesh → Mac nb-mac-01 __MAC_MESH_IP__
# 兜底：mesh 主上游探不活时回退 252 本机容器（backup），X-Pocket-Upstream 响应头暴露实际服务方。
# 回滚：mv 本文件为 .disabled + nginx -t + reload（证书 lineage 保留）。
upstream pocket_mac_api {
    # NetBird mesh 到 Mac nb-mac-01（主），252 本机 pocketd 兜底。
    server __MAC_MESH_IP__:8090 max_fails=3 fail_timeout=15s;
    server 172.16.2.210:8090 backup;
    keepalive 8;
}

upstream pocket_mac_web {
    # NetBird mesh 到 Mac frontend :4175（主），252 本机 frontend 兜底。
    server __MAC_MESH_IP__:4175 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:4175 backup;
    keepalive 4;
}

server {
    listen 9443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name pocket.itestu.cn;

    ssl_certificate /etc/letsencrypt/live/pocket.itestu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocket.itestu.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;
    # mesh 主上游不可达时快速切换兜底（默认 60s 会造成周期性卡顿）
    proxy_connect_timeout 3s;

    location = /healthz {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_mac_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /plugin/ws {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 事件回调（飞书 / 企业微信）2026-10-03 补。
    #
    # 为什么必须单独写：此前**全仓没有任何 /callback/ 规则**，请求落进下面的
    # `location /` 被当成 SPA 返回 index.html。实测（2026-10-03）：
    #   GET  https://pocket.itestu.cn/callback/feishu  -> 200 + 一段 HTML
    #   POST https://pocket.itestu.cn/callback/feishu  -> 飞书收不到 {"code":0,"msg":"ok"}
    # 而正确部署下同一个路由在应用里是活的（POST 空体 -> 200 {"code":0,"msg":"ok"}，
    # 企业微信那个 -> 400 拒绝畸形请求）。也就是说事件投递必然失败，
    # 而且失败的样子（拿到 HTML）很容易被误读成「平台没配好」。
    #
    # 为什么不能挂在 requireAuth 后面（后端 server.go:682/689 已经明确不套）：
    # 飞书/企业微信是带**协议签名**来的，不带本站 JWT；挂鉴权只会让签名请求永远 401。
    # 签名校验由应用内 feishu / wecom 包自己做，这里只负责把请求送到后端。
    location /callback/ {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_mac_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        add_header X-Pocket-Upstream $upstream_addr always;
        proxy_pass http://pocket_mac_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
