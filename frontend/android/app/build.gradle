apply plugin: 'com.android.application'

android {
    namespace = "com.kaixuan.opencode.pocket"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kaixuan.opencode.pocket"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2.0-openpocket"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // 开发/测试构建：允许 WebView mixed-content（ws:// from https://localhost）
            debuggable true
            // 联调用旁挂包：`gradlew assembleDebug -PsttDevApp` 会把调试包改成
            // 独立的 applicationId，与手机上已装的正式包**并存**、数据互不干扰。
            //
            // 为什么需要它：调试包通常要 VITE_API_BASE 指向本机 pocketd 才能联调，
            // 而正式包里的 localStorage 覆盖（pocket_api_base）优先级高于构建期
            // base，localStorage 又按 origin+包名隔离——不换 applicationId 就只能
            // 改用户的「后端服务器」设置，那会连带清掉他已登录的会话。
            // 默认不传这个属性，行为与之前完全一致。
            if (project.hasProperty('sttDevApp')) {
                applicationIdSuffix ".sttdev"
                versionNameSuffix "-sttdev"
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // AGP 8 默认关闭 BuildConfig 生成；MainActivity 需要 BuildConfig.DEBUG
    // 判断调试开关（原生顺滑度审计 A7/P0 #6）
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// cap-sherpa（本地 ASR，Phase 4）：sherpa-onnx 官方 Android AAR（全 ABI，
// 含 com.k2fsa.sherpa.onnx JNI 绑定）。AAR 不进 git（android/.gitignore 的
// *.aar 是仓库既有约定），构建前自动就位——已存在则跳过，离线增量构建
// 不受影响。升级版本 = 改下面 URL 与依赖行里的版本号。
def sherpaAar = file('libs/sherpa-onnx-1.13.8.aar')
tasks.register('downloadSherpaAar') {
    onlyIf { !sherpaAar.exists() }
    doLast {
        sherpaAar.parentFile.mkdirs()
        def tmp = new File(sherpaAar.path + '.part')
        def conn = new URL('https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar').openConnection()
        conn.setRequestProperty('User-Agent', 'openpocket-gradle/1.0')
        conn.setConnectTimeout(30000)
        conn.setReadTimeout(120000)
        conn.setInstanceFollowRedirects(true)
        if (conn.getResponseCode() < 200 || conn.getResponseCode() >= 300) {
            throw new GradleException("sherpa AAR download HTTP ${conn.getResponseCode()}")
        }
        byte[] buf = new byte[1 << 16]
        InputStream ins = conn.getInputStream()
        FileOutputStream outs = new FileOutputStream(tmp)
        try {
            int n
            while ((n = ins.read(buf)) > 0) outs.write(buf, 0, n)
        } finally {
            ins.close()
            outs.close()
            conn.disconnect()
        }
        if (!tmp.renameTo(sherpaAar)) throw new GradleException('cannot finalize sherpa AAR download')
        println "sherpa-onnx AAR downloaded: ${sherpaAar.length()} bytes"
    }
}
tasks.named('preBuild') { dependsOn 'downloadSherpaAar' }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    // 模型分发包是 tar.bz2：tar + bzip2 解包（SherpaPlugin.extractTarBz2）。
    // commons-io/commons-lang3 由 commons-compress 1.26 传递引入。
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // 指纹/人脸登录绑定（BiometricAuthPlugin：BiometricPrompt + CryptoObject）
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
