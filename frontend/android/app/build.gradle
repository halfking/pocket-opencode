apply plugin: 'com.android.application'

// Use the same exported origin for the Vite bundle and Android manifest.
def ssoAppOrigin = System.getenv('VITE_SSO_APP_LINK_ORIGIN') ?: 'https://openpocket-app-link.invalid'
def ssoAppLink = new URI(ssoAppOrigin)
if (ssoAppLink.scheme != 'https' || !ssoAppLink.host || ssoAppOrigin != "https://${ssoAppLink.host}") {
    throw new GradleException('VITE_SSO_APP_LINK_ORIGIN must be an HTTPS origin without a port')
}

def releaseSigningKeys = [
    'POCKET_RELEASE_STORE_FILE',
    'POCKET_RELEASE_STORE_PASSWORD',
    'POCKET_RELEASE_KEY_ALIAS',
    'POCKET_RELEASE_KEY_PASSWORD'
]
def releaseSigning = releaseSigningKeys.collectEntries { key ->
    [(key): providers.environmentVariable(key).orElse(providers.gradleProperty(key)).getOrNull()]
}
def hasReleaseSigning = releaseSigning.values().any { it != null }
File releaseStore = null
if (hasReleaseSigning) {
    def missing = releaseSigningKeys.findAll { !releaseSigning[it]?.trim() }
    if (missing) {
        throw new GradleException("Incomplete Android release signing configuration: set ${missing.join(', ')}")
    }
    releaseStore = rootProject.file(releaseSigning.POCKET_RELEASE_STORE_FILE)
    if (!releaseStore.isFile()) {
        throw new GradleException('POCKET_RELEASE_STORE_FILE must point to an existing Android keystore')
    }
}

android {
    namespace = "com.kaixuan.opencode.pocket"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kaixuan.opencode.pocket"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2.0-openpocket"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [ssoAppLinkHost: ssoAppLink.host]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            pocketRelease {
                storeFile = releaseStore
                storePassword = releaseSigning.POCKET_RELEASE_STORE_PASSWORD
                keyAlias = releaseSigning.POCKET_RELEASE_KEY_ALIAS
                keyPassword = releaseSigning.POCKET_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            // 开发/测试构建：允许 WebView mixed-content（ws:// from https://localhost）
            debuggable true
            // 联调用旁挂包：`gradlew assembleDebug -PsttDevApp` 会把调试包改成
            // 独立的 applicationId，与手机上已装的正式包**并存**、数据互不干扰。
            //
            // 为什么需要它：调试包通常要 VITE_API_BASE 指向本机 pocketd 才能联调，
            // 而正式包里的 localStorage 覆盖（pocket_api_base）优先级高于构建期
            // base，localStorage 又按 origin+包名隔离——不换 applicationId 就只能
            // 改用户的「后端服务器」设置，那会连带清掉他已登录的会话。
            // 默认不传这个属性，行为与之前完全一致。
            if (project.hasProperty('sttDevApp')) {
                applicationIdSuffix ".sttdev"
                versionNameSuffix "-sttdev"
            }
            // 设备验收旁挂包（2026-10-04 新增）：`-PappIdSuffix=.matrix` 换一个
            // applicationId，与设备上已有的**正式包**和 **.sttdev 旁挂包**
            // 三者并存、互不干扰。
            //
            // 为什么需要「第三个」而不是复用 .sttdev（2026-10-04 实测）：
            // 设备上已有的 .sttdev 是**另一台机器**的 debug keystore 签的
            // （证书 9a06f76f… vs 本机 eac58170…），`adb install -r` 会报
            // INSTALL_FAILED_UPDATE_INCOMPATIBLE。旧解法只有**卸载**——
            // 那会清掉该包的登录态与本地库，属于要用户点头的代价。
            // 换 applicationId 就不必卸载任何东西，**零数据损失**。
            //
            // 不传该属性时行为与之前完全一致（见下方 else 的自证）。
            if (project.hasProperty('appIdSuffix')) {
                applicationIdSuffix project.property('appIdSuffix')
                versionNameSuffix project.property('appIdSuffix')
            } else {
                // 自证：默认路径必须仍是「正式包」或「.sttdev」，
                // 不能因为加了新分支而把两者之一悄悄改掉。
                logger.lifecycle("[build-android] appIdSuffix 未设置：applicationIdSuffix=${applicationIdSuffix ?: '(无，即正式包)'}")
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.pocketRelease
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // AGP 8 默认关闭 BuildConfig 生成；MainActivity 需要 BuildConfig.DEBUG
    // 判断调试开关（原生顺滑度审计 A7/P0 #6）
    buildFeatures {
        buildConfig true
    }
    testOptions { unitTests.includeAndroidResources = true }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// cap-sherpa（本地 ASR，Phase 4 → Phase 1 VAD 延迟优化）：sherpa-onnx 官方 Android AAR（全 ABI，
// 含 com.k2fsa.sherpa.onnx JNI 绑定）。AAR 不进 git（android/.gitignore 的
// *.aar 是仓库既有约定），构建前自动就位——已存在则跳过，离线增量构建
// 不受影响。升级版本 = 改下面 URL 与依赖行里的版本号。
// v2.0.1 新增完整 VAD 支持（Vad/VadModelConfig/SileroVadModelConfig），实现动态端点检测。
def sherpaAar = file('libs/sherpa-onnx-2.0.1.aar')
tasks.register('downloadSherpaAar') {
    onlyIf { !sherpaAar.exists() }
    doLast {
        sherpaAar.parentFile.mkdirs()
        def tmp = new File(sherpaAar.path + '.part')
        // ⚠️ 与 downloadSileroVad 同款：上游 GitHub releases 偶发 5xx，
        //    CI 冷环境一次失败即红 ⇒ 3 次指数退避重试。
        def url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar'
        def maxAttempts = 3
        def lastErr = null
        for (int attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
                if (attempt > 1) sleep((2 * (1 << (attempt - 1))) * 1000L) // 4s, 8s
                def conn = new URL(url).openConnection()
                conn.setRequestProperty('User-Agent', 'openpocket-gradle/1.0')
                conn.setConnectTimeout(30000)
                conn.setReadTimeout(120000)
                conn.setInstanceFollowRedirects(true)
                def code = conn.getResponseCode()
                if (code < 200 || code >= 300) throw new IOException("HTTP ${code}")
                byte[] buf = new byte[1 << 16]
                InputStream ins = conn.getInputStream()
                FileOutputStream outs = new FileOutputStream(tmp)
                try {
                    int n
                    while ((n = ins.read(buf)) > 0) outs.write(buf, 0, n)
                } finally {
                    ins.close()
                    outs.close()
                    conn.disconnect()
                }
                if (!tmp.renameTo(sherpaAar)) throw new IOException('cannot finalize rename')
                println "sherpa-onnx AAR downloaded: ${sherpaAar.length()} bytes (attempt ${attempt})"
                lastErr = null
                break
            } catch (Exception e) {
                lastErr = e
                tmp.delete()
                println "sherpa AAR download attempt ${attempt}/${maxAttempts} failed: ${e.message}"
            }
        }
        if (lastErr != null) throw new GradleException("sherpa AAR download failed after ${maxAttempts} attempts: ${lastErr.message}")
    }
}

// Phase 1 VAD 延迟优化：Silero VAD 模型自动下载
// 模型文件放在 assets/ 目录，运行时加载，不进 git（.gitignore 已覆盖）
def sileroVadModel = file('src/main/assets/silero_vad.onnx')
tasks.register('downloadSileroVad') {
    onlyIf { !sileroVadModel.exists() }
    doLast {
        sileroVadModel.parentFile.mkdirs()
        def tmp = new File(sileroVadModel.path + '.part')
        // Silero VAD v4 模型 (~1MB)，来自官方 GitHub 仓库
        // ⚠️ 2026-11-27 CI 实证（run 46049149656）：上游 GitHub raw 偶发 504，
        //    mac 本地因模型已缓存 never 触发，CI 冷环境一次失败即红。
        //    ⇒ 3 次指数退避重试（2s/4s/8s），仍失败才抛。
        def url = 'https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx'
        def maxAttempts = 3
        def lastErr = null
        for (int attempt = 1; attempt <= maxAttempts; attempt++) {
            try {
                if (attempt > 1) sleep((2 * (1 << (attempt - 1))) * 1000L) // 4s, 8s
                def conn = new URL(url).openConnection()
                conn.setRequestProperty('User-Agent', 'openpocket-gradle/1.0')
                conn.setConnectTimeout(30000)
                conn.setReadTimeout(60000)
                conn.setInstanceFollowRedirects(true)
                def code = conn.getResponseCode()
                if (code < 200 || code >= 300) throw new IOException("HTTP ${code}")
                byte[] buf = new byte[1 << 16]
                InputStream ins = conn.getInputStream()
                FileOutputStream outs = new FileOutputStream(tmp)
                try {
                    int n
                    while ((n = ins.read(buf)) > 0) outs.write(buf, 0, n)
                } finally {
                    ins.close()
                    outs.close()
                    conn.disconnect()
                }
                if (!tmp.renameTo(sileroVadModel)) throw new IOException('cannot finalize rename')
                println "Silero VAD model downloaded: ${sileroVadModel.length()} bytes (attempt ${attempt})"
                lastErr = null
                break
            } catch (Exception e) {
                lastErr = e
                tmp.delete()
                println "Silero VAD download attempt ${attempt}/${maxAttempts} failed: ${e.message}"
            }
        }
        if (lastErr != null) throw new GradleException("Silero VAD model download failed after ${maxAttempts} attempts: ${lastErr.message}")
    }
}

tasks.named('preBuild') { dependsOn 'downloadSherpaAar', 'downloadSileroVad' }

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    // 模型分发包是 tar.bz2：tar + bzip2 解包（SherpaPlugin.extractTarBz2）。
    // commons-io/commons-lang3 由 commons-compress 1.26 传递引入。
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // 指纹/人脸登录绑定（BiometricAuthPlugin：BiometricPrompt + CryptoObject）
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Match the SQLCipher runtime used by @capacitor-community/sqlite.
    implementation 'net.zetetic:sqlcipher-android:4.10.0@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
